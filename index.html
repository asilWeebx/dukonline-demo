<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
  <title>Do'kon</title>
  <link rel="icon" href="data:,">
  <!-- Xarita (yetkazish joyini belgilash) — OpenStreetMap, kalitsiz -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>document.write('<script src="./config.js?_='+Date.now()+'"><\/script>')</script>
  <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #faf7f2;
      color: #2b2620;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      letter-spacing: -0.005em;
    }
    ::-webkit-scrollbar { width: 0; height: 0; }
    input, select, button, textarea { font-family: inherit; }
    input:focus, select:focus { outline: none; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }

    /* ── Design tokens (soft, Tilda-like warm minimalism) ─── */
    :root {
      --bg: #faf7f2;                /* warm cream page bg */
      --bg-card: #ffffff;           /* card surface */
      --bg-soft: #f3ede3;           /* deeper sand */
      --bg-muted: #f7f2ea;          /* subtle muted */
      --ink: #2b2620;               /* primary warm charcoal */
      --ink-soft: #6b6359;          /* secondary text */
      --ink-faint: #a8a096;         /* tertiary / meta */
      --sage: #7a8b6f;              /* primary accent — soft sage */
      --sage-deep: #5d6e54;         /* hover / pressed */
      --sage-tint: #e5ebe0;         /* sage tint background */
      --clay: #c97b5c;              /* warm terracotta — sale/badge */
      --clay-tint: #f5e3d8;
      --line: #e8e2d8;              /* hairline borders */
      --line-soft: #f0ebe2;
      --shadow-soft: 0 1px 2px rgba(43,38,32,0.04), 0 4px 16px rgba(43,38,32,0.05);
      --shadow-card: 0 1px 3px rgba(43,38,32,0.05), 0 8px 28px rgba(43,38,32,0.06);
      --shadow-float: 0 4px 24px rgba(43,38,32,0.08), 0 12px 48px rgba(43,38,32,0.06);
      --radius: 14px;
      --radius-sm: 10px;
      --radius-pill: 999px;
      /* Compatibility shims for the JS that references these */
      --accent: #7a8b6f;
      --accent-dark: #5d6e54;
      --accent-bg: rgba(122,139,111,0.12);
      --coral: #c97b5c;
      --coral-dark: #b06548;
    }

    /* ── Utility ─────────────────────────── */
    .clamp1 { display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden; }
    .clamp2 { display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; }
    .clamp3 { display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden; }

    /* ── Animations ──────────────────────── */
    @keyframes fadeUp  { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
    @keyframes fadeIn  { from{opacity:0} to{opacity:1} }
    @keyframes popIn   { from{opacity:0;transform:scale(.94)} to{opacity:1;transform:none} }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    @keyframes slideUp { from{transform:translateY(100%)} to{transform:none} }
    .fade-up  { animation: fadeUp  .42s cubic-bezier(.16,1,.3,1) both; }
    .fade-in  { animation: fadeIn  .25s ease both; }
    .pop-in   { animation: popIn   .3s cubic-bezier(.34,1.4,.64,1) both; }
    .slide-up { animation: slideUp .36s cubic-bezier(.32,.72,0,1) both; }

    /* ── Header ──────────────────────────── */
    .site-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(250,247,242,0.88);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--line-soft);
    }
    .header-inner {
      max-width: 1400px; margin: 0 auto;
      padding: 0 28px;
      height: 72px;
      display: flex; align-items: center; gap: 20px;
    }
    .header-logo {
      font-family: 'Montserrat', -apple-system, sans-serif;
      font-size: 22px; font-weight: 700; color: var(--ink);
      white-space: nowrap; letter-spacing: -0.02em; flex-shrink: 0;
    }
    .header-logo span { color: var(--sage); }
    .header-search {
      flex: 1; max-width: 440px;
      display: flex; align-items: center; gap: 10px;
      background: var(--bg-card); border: 1px solid var(--line);
      border-radius: var(--radius-pill);
      padding: 0 18px; height: 44px;
      transition: border-color .2s, box-shadow .2s;
    }
    .header-search:focus-within {
      border-color: var(--sage);
      box-shadow: 0 0 0 3px var(--sage-tint);
    }
    .header-search svg { color: var(--ink-faint); flex-shrink: 0; }
    .header-search input {
      flex: 1; border: none; background: transparent;
      font-size: 14px; font-weight: 400; color: var(--ink);
      letter-spacing: -0.01em;
    }
    .header-search input::placeholder { color: var(--ink-faint); font-weight: 400; }
    .header-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-shrink: 0; }
    .icon-btn {
      position: relative; width: 44px; height: 44px;
      border-radius: 50%; border: 1px solid var(--line);
      background: var(--bg-card);
      display: flex; align-items: center; justify-content: center;
      color: var(--ink-soft); transition: all .2s ease;
    }
    .icon-btn:hover {
      background: var(--sage-tint); color: var(--sage-deep);
      border-color: var(--sage-tint);
    }
    .badge {
      position: absolute; top: -2px; right: -2px;
      background: var(--clay); color: #fff;
      font-size: 10px; font-weight: 700;
      min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--bg);
      font-family: 'Montserrat', sans-serif;
    }
    .login-btn {
      height: 40px; padding: 0 20px; border-radius: var(--radius-pill);
      border: 1px solid var(--line); background: var(--bg-card);
      font-size: 13px; font-weight: 600; color: var(--ink);
      transition: all .2s ease; letter-spacing: -0.01em;
    }
    .login-btn:hover {
      border-color: var(--sage); color: var(--sage-deep);
      background: var(--sage-tint);
    }
    .avatar-btn {
      width: 40px; height: 40px; border-radius: 50%; border: none;
      background: var(--sage); color: #fff; font-weight: 700; font-size: 14px;
      font-family: 'Montserrat', -apple-system, sans-serif;
      transition: background .2s;
    }
    .avatar-btn:hover { background: var(--sage-deep); }

    /* ── Category Bar ────────────────────── */
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cat-bar {
      position: sticky; top: 72px; z-index: 99;
      animation: slideDown 0.4s ease-out;
      transition: background-color 0.22s cubic-bezier(0.22, 0.61, 0.36, 1),
                  box-shadow 0.22s cubic-bezier(0.22, 0.61, 0.36, 1),
                  border-color 0.22s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .cat-bar-stuck {
      background: rgba(250,247,242,0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 2px 12px rgba(43,38,32,0.05);
      border-bottom: 1px solid var(--line-soft);
    }
    .cat-bar-inner {
      max-width: 1400px; margin: 0 auto; padding: 14px 28px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      overflow-x: auto; scrollbar-width: none;
      height: auto;
      transition: padding 0.22s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .cat-bar-inner::-webkit-scrollbar { display: none; }
    .cat-bar-stuck .cat-bar-inner { padding: 8px 28px; }
    .cat-chip {
      flex-shrink: 0; height: 64px; padding: 14px 22px 14px 10px;
      border-radius: var(--radius); border: 1px solid var(--line);
      background: var(--bg-card); font-size: 14px; font-weight: 500; color: var(--ink);
      letter-spacing: -0.01em;
      transition: all 0.22s cubic-bezier(0.22, 0.61, 0.36, 1);
      position: relative; cursor: pointer; display: inline-flex;
      align-items: center; gap: 12px; overflow: visible;
    }
    .cat-bar-stuck .cat-chip {
      height: 42px; padding: 8px 16px 8px 6px; font-size: 12.5px; gap: 8px;
    }
    .cat-chip:hover {
      background: var(--sage-tint); color: var(--sage-deep); border-color: var(--sage-tint);
    }
    .cat-chip.active {
      background: var(--ink); border-color: var(--ink); color: #fff;
      box-shadow: 0 4px 14px rgba(43,38,32,0.18);
    }

    /* sub-kategoriya qatori (top'ning ostida) */
    .cat-bar-sub { top: 136px; z-index: 98; }
    .cat-bar-sub .cat-bar-inner { height: 52px; }
    .cat-chip-sub { height: 36px; font-size: 12.5px; padding: 0 18px; font-weight: 500; }
    .cat-chip-sub.active {
      background: var(--sage); border-color: var(--sage); color: #fff;
      box-shadow: 0 3px 10px rgba(122,139,111,0.3);
    }

    /* ── Page body ───────────────────────── */
    .page-body {
      max-width: 1400px; margin: 0 auto;
      padding: 36px 28px 100px;
    }
    .page-title {
      font-family: 'Montserrat', -apple-system, sans-serif;
      font-size: 36px; font-weight: 700; color: var(--ink);
      letter-spacing: -0.025em; margin-bottom: 28px;
      scroll-margin-top: 220px;
      line-height: 1.1;
    }
    .page-title span { color: var(--ink-faint); font-weight: 400; font-size: 17px; margin-left: 12px; font-family: 'Montserrat', sans-serif; letter-spacing: -0.01em; }
    @media (max-width: 640px) { .page-title { scroll-margin-top: 170px; font-size: 28px; } }

    /* ── Category Sections (Barchasi ko'rinishi) ─── */
    .cat-sections { display: flex; flex-direction: column; gap: 56px; }
    .cat-section { scroll-margin-top: 180px; }
    .cat-section-title {
      font-family: 'Montserrat', -apple-system, sans-serif;
      font-size: 26px; font-weight: 700; color: var(--ink);
      letter-spacing: -0.02em; margin-bottom: 22px;
      line-height: 1.2;
    }
    @media (max-width: 640px) {
      .cat-section { scroll-margin-top: 140px; }
      .cat-section-title { font-size: 21px; margin-bottom: 16px; }
    }

    /* ── Product Grid ────────────────────── */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 36px 24px;
    }
    @media (max-width: 1200px) { .product-grid { grid-template-columns: repeat(3,1fr); } }
    @media (max-width: 860px)  { .product-grid { grid-template-columns: repeat(2,1fr); gap: 28px 16px; } }
    @media (max-width: 480px)  { .product-grid { grid-template-columns: repeat(2,1fr); gap: 22px 12px; } }
    @media (max-width: 340px)  { .product-grid { grid-template-columns: 1fr; } }

    /* ── Top tovarlar (tavsiya karusel) ──── */
    .top-rail-wrap { margin: 4px 0 32px; }
    .top-rail-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .top-rail-head h2 { font-size: 20px; font-weight: 800; color: var(--ink); margin: 0; letter-spacing: -0.01em; }
    .top-rail-badge { font-size: 12px; font-weight: 700; color: var(--sage-deep); background: var(--sage-tint); padding: 3px 11px; border-radius: 20px; white-space: nowrap; }
    .top-rail { display: flex; gap: 24px; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
    .top-rail::-webkit-scrollbar { height: 6px; }
    .top-rail::-webkit-scrollbar-track { background: transparent; }
    .top-rail::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
    .top-rail-item { position: relative; flex: 0 0 auto; width: 210px; scroll-snap-align: start; }
    .top-rail-rank {
      position: absolute; top: 10px; left: 10px; z-index: 2;
      display: flex; align-items: center; gap: 4px;
      background: var(--sage-deep); color: #fff;
      font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
      padding: 4px 8px 4px 6px; border-radius: 6px;
      font-family: 'Montserrat', sans-serif;
      pointer-events: none;
    }
    @media (max-width: 860px) { .top-rail { gap: 16px; } .top-rail-item { width: 170px; } }
    @media (max-width: 480px) { .top-rail-item { width: 150px; } .top-rail-head h2 { font-size: 18px; } }

    /* ── Product Item ─────────────────────── */
    .product-item {
      display: flex; flex-direction: column; gap: 0;
      cursor: pointer;
      transition: transform .3s cubic-bezier(.16,1,.3,1);
    }
    .product-item:hover { transform: translateY(-3px); }
    .product-img-wrap {
      position: relative;
      background: var(--bg-muted);
      border-radius: var(--radius);
      aspect-ratio: 1 / 1;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 14px;
      transition: background .25s, box-shadow .25s;
      cursor: zoom-in;
    }
    .product-item:hover .product-img-wrap {
      background: var(--bg-soft);
      box-shadow: var(--shadow-card);
    }
    .product-img-wrap img {
      width: 90%; height: 90%;
      object-fit: contain;
      display: block;
      border-radius: var(--radius);
      transition: transform .5s cubic-bezier(.16,1,.3,1);
    }
    .product-item:hover .product-img-wrap img { transform: scale(1.06); }
    .product-no-img {
      width: 56px; height: 56px; opacity: .2;
    }
    .stock-out-overlay {
      position: absolute; inset: 0; border-radius: var(--radius);
      background: rgba(250,247,242,0.78);
      backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center;
    }
    .stock-out-tag {
      background: var(--bg-card); color: var(--ink-soft);
      font-size: 11px; font-weight: 600;
      padding: 6px 14px; border-radius: var(--radius-pill);
      letter-spacing: .04em; text-transform: uppercase;
      border: 1px solid var(--line);
      box-shadow: var(--shadow-soft);
    }
    .in-cart-dot {
      position: absolute; top: 12px; right: 12px;
      background: var(--sage); color: #fff;
      font-size: 11px; font-weight: 700;
      min-width: 22px; height: 22px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 6px;
      box-shadow: 0 2px 8px rgba(122,139,111,0.4);
      font-family: 'Montserrat', sans-serif;
    }
    .product-name {
      font-size: 14px; font-weight: 600; color: var(--ink);
      line-height: 1.4; margin-bottom: 5px;
      letter-spacing: -0.01em;
    }
    .product-meta {
      font-size: 12px; color: var(--ink-faint); margin-bottom: 8px; line-height: 1.4;
      font-weight: 400;
    }
    .product-price {
      font-size: 17px; font-weight: 600; color: var(--ink);
      letter-spacing: -0.015em; margin-bottom: 12px;
      line-height: 1.2;
    }
    .unit-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px;
    }
    .unit-label { font-size: 11px; color: var(--ink-faint); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
    .unit-select-wrap { position: relative; }
    .unit-select {
      height: 30px; padding: 0 26px 0 12px;
      border: 1px solid var(--line); border-radius: 8px;
      background: var(--bg-card); font-size: 12px; color: var(--ink); font-weight: 500;
      -webkit-appearance: none; appearance: none; cursor: pointer;
      transition: border-color .2s;
    }
    .unit-select:focus, .unit-select:hover { border-color: var(--sage); }
    .unit-caret {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      pointer-events: none; color: var(--ink-faint);
    }
    .controls-row {
      display: flex; align-items: center; gap: 8px;
      margin-top: auto;
    }
    .qty-wrap {
      display: flex; align-items: center; justify-content: space-between;
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      overflow: hidden; flex: 1;
      background: var(--bg-card);
      transition: border-color .2s ease, box-shadow .2s ease;
      animation: qtyWrapIn .28s cubic-bezier(.34,1.56,.64,1);
    }
    @media (min-width: 641px) {
      .qty-wrap { flex: 0 0 auto; width: 68%; margin: 0 auto; }
    }
    .qty-wrap:hover { border-color: var(--sage); box-shadow: 0 2px 10px rgba(122,139,111,.1); }
    @keyframes qtyWrapIn {
      0% { transform: scale(1.1); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .qty-btn {
      width: 36px; height: 38px; flex: 0 0 36px; border: none; background: transparent;
      padding: 8px;
      font-size: 18px; color: var(--ink-soft); display: flex; align-items: center; justify-content: center;
      transition: background .15s ease, color .15s ease, transform .12s ease; font-weight: 400;
    }
    .qty-btn:hover { background: var(--sage-tint); color: var(--sage-deep); }
    .qty-btn:active { background: var(--sage-tint); transform: scale(.88); }
    .qty-num {
      width: 32px; text-align: center; font-size: 14px; font-weight: 600; color: var(--ink);
      border: none;
      line-height: 38px;
      transition: transform .15s ease, color .15s ease;
    }
    .qty-wrap:has(.qty-btn:active) .qty-num { animation: qtyPop .22s ease; }
    @keyframes qtyPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.18); color: var(--sage-deep); }
      100% { transform: scale(1); }
    }
    .add-btn {
      flex: 1; height: 42px; border-radius: var(--radius-sm); border: none;
      background: var(--ink); color: #fff;
      font-size: 13px; font-weight: 600;
      letter-spacing: -0.01em;
      box-shadow: 0 2px 8px rgba(43,38,32,0.15);
      transition: background .2s ease, box-shadow .2s ease,
                  transform .22s cubic-bezier(.34,1.56,.64,1), border-radius .22s ease;
      white-space: nowrap;
      font-family: 'Montserrat', sans-serif;
    }
    .add-btn:disabled { background: var(--line); color: var(--ink-faint); box-shadow: none; cursor: not-allowed; }
    @media (hover: hover) {
      .add-btn:hover:not(.btn-added):not(:disabled) {
        background: var(--sage); box-shadow: 0 4px 14px rgba(122,139,111,0.35);
      }
      .add-btn:active:not(.btn-added):not(:disabled) {
        transform: scaleX(.85) scaleY(.92);
        border-radius: 21px;
      }
    }
    .add-btn.btn-added {
      background: var(--sage) !important; color: #fff !important;
      box-shadow: 0 2px 10px rgba(122,139,111,0.4) !important;
      pointer-events: none;
    }

    /* Skeleton */
    .skel {
      background: linear-gradient(90deg, var(--bg-muted) 25%, var(--bg-soft) 50%, var(--bg-muted) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite;
      border-radius: var(--radius);
    }

    /* ── Empty / Error ────────────────────── */
    .state-center {
      grid-column: 1/-1; text-align: center; padding: 80px 20px;
    }
    .state-emoji { font-size: 44px; margin-bottom: 16px; }
    .state-text  { font-size: 15px; color: var(--ink-soft); font-weight: 400; }
    .fallback-label {
      font-size: 12px; font-weight: 700; color: var(--ink-faint); text-transform: uppercase;
      letter-spacing: .06em; text-align: center; margin: 0 0 24px;
    }

    /* ── Overlay / Sheet ─────────────────── */
    .overlay-bg {
      position: fixed; inset: 0; z-index: 9100;
    }
    .overlay-dim {
      position: absolute; inset: 0; background: rgba(43,38,32,0.4);
      backdrop-filter: blur(4px);
    }
    .bottom-sheet {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: var(--bg); border-radius: 24px 24px 0 0;
      max-height: 90vh; display: flex; flex-direction: column;
      overflow: hidden;
      box-shadow: 0 -8px 40px rgba(43,38,32,0.15);
    }
    .sheet-handle {
      width: 40px; height: 4px; background: var(--line); border-radius: 2px;
      margin: 14px auto 4px;
    }
    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 22px 16px;
    }
    .sheet-title {
      font-family: 'Montserrat', -apple-system, sans-serif;
      font-size: 19px; font-weight: 600; color: var(--ink);
      letter-spacing: -0.02em;
    }
    .close-btn {
      width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
      background: var(--bg-card); display: flex; align-items: center; justify-content: center;
      color: var(--ink-soft); transition: all .2s;
    }
    .close-btn:hover { background: var(--sage-tint); color: var(--sage-deep); border-color: var(--sage-tint); }
    .sheet-body { flex: 1; overflow-y: auto; padding: 0 0 8px; }
    .sheet-footer { padding: 14px 22px 34px; border-top: 1px solid var(--line-soft); }

    /* ── Cart ─────────────────────────────── */
    .cart-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 22px; border-bottom: 1px solid var(--line-soft);
    }
    .cart-thumb {
      width: 56px; height: 56px; border-radius: 12px;
      background: var(--bg-muted); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .cart-thumb img { width: 100%; height: 100%; object-fit: contain; }
    .cart-info { flex: 1; min-width: 0; }
    .cart-name  { font-size: 13px; font-weight: 600; color: var(--ink); }
    .cart-price { font-size: 12px; color: var(--sage-deep); font-weight: 600; margin-top: 2px; }
    .cart-qty-row { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .mini-btn {
      width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--bg-card); font-size: 14px; color: var(--ink-soft);
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .mini-btn:hover { background: var(--sage-tint); color: var(--sage-deep); border-color: var(--sage-tint); }
    .mini-qty { width: 24px; text-align: center; font-size: 13px; font-weight: 600; }

    /* ── Checkout form ─────────────────────── */
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 11px; font-weight: 600; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .06em; }
    .form-input {
      height: 48px; border: 1px solid var(--line); border-radius: var(--radius-sm);
      padding: 0 16px; font-size: 14px; color: var(--ink); background: var(--bg-card);
      transition: border-color .15s, box-shadow .15s;
      font-weight: 400;
    }
    .form-input:focus { border-color: var(--sage); box-shadow: 0 0 0 3px var(--sage-tint); background: var(--bg-card); }
    .primary-btn {
      width: 100%; height: 50px; border-radius: var(--radius-sm); border: none;
      background: var(--ink); color: #fff; font-size: 15px; font-weight: 600;
      box-shadow: 0 2px 10px rgba(43,38,32,0.2);
      transition: all .2s;
      letter-spacing: -0.01em;
    }
    .primary-btn:hover { background: var(--sage); box-shadow: 0 4px 14px rgba(122,139,111,0.35); }
    .primary-btn:disabled { background: var(--line); color: var(--ink-faint); box-shadow: none; cursor: not-allowed; }
    .dark-btn {
      width: 100%; height: 48px; border-radius: var(--radius-sm); border: none;
      background: var(--ink); color: #fff; font-size: 14px; font-weight: 600;
      transition: background .2s;
    }
    .dark-btn:hover { background: var(--sage); }
    .err-box {
      background: var(--clay-tint); color: var(--clay); border-radius: var(--radius-sm);
      padding: 12px 16px; font-size: 13px; font-weight: 500;
      border: 1px solid rgba(201,123,92,0.25);
    }
    .total-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px; background: var(--bg-muted); border-radius: var(--radius-sm);
    }
    .total-label { font-size: 15px; color: var(--ink-soft); font-weight: 500; }
    .total-val   { font-size: 18px; font-weight: 600; color: var(--ink); letter-spacing: -0.015em; }

    /* ── Success modal ────────────────────── */
    .modal-center {
      position: fixed; inset: 0; z-index: 9200;
      display: flex; align-items: center; justify-content: center;
      background: rgba(43,38,32,0.5); backdrop-filter: blur(6px); padding: 20px;
    }
    .modal-card {
      background: var(--bg); border-radius: 24px; padding: 44px 32px;
      text-align: center; width: 100%; max-width: 380px;
      box-shadow: var(--shadow-float);
    }
    .success-icon {
      width: 76px; height: 76px; border-radius: 50%;
      background: var(--sage-tint);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 22px; font-size: 36px;
    }

    /* ── Customer portal ──────────────────────── */
    .portal-sheet {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: var(--bg); border-radius: 28px 28px 0 0;
      max-height: 88vh; display: flex; flex-direction: column;
      overflow: hidden; max-width: 560px; margin: 0 auto;
      box-shadow: 0 -8px 40px rgba(43,38,32,0.15);
    }
    .portal-handle { width: 40px; height: 4px; background: var(--line); border-radius: 2px; margin: 14px auto 0; flex-shrink: 0; }
    .portal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px 0; flex-shrink: 0; }
    .portal-title {
      font-family: 'Montserrat', -apple-system, sans-serif;
      font-size: 22px; font-weight: 600; color: var(--ink); letter-spacing: -0.02em;
    }
    .portal-logout { height: 34px; padding: 0 16px; border-radius: var(--radius-pill); border: 1px solid var(--clay-tint); background: var(--clay-tint); color: var(--clay); font-weight: 600; font-size: 12px; cursor: pointer; transition: all .2s; }
    .portal-logout:hover { background: var(--clay); color: #fff; border-color: var(--clay); }
    .portal-tabs { display: flex; padding: 16px 22px 0; gap: 4px; flex-shrink: 0; border-bottom: 1px solid var(--line-soft); }
    .portal-tab { flex: 1; padding: 8px 4px 12px; border: none; background: transparent; font-size: 12px; font-weight: 500; color: var(--ink-faint); cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; white-space: nowrap; letter-spacing: -0.01em; }
    .portal-tab.active { color: var(--sage-deep); border-bottom-color: var(--sage); font-weight: 600; }
    .portal-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 18px 22px 36px; display: flex; flex-direction: column; gap: 12px; }
    /* profile card */
    .portal-profile-card { background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: 20px; padding: 22px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow-soft); }
    .portal-avatar { width: 54px; height: 54px; border-radius: 50%; background: var(--sage); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #fff; flex-shrink: 0; font-family: 'Montserrat', -apple-system, sans-serif; }
    .portal-profile-info { flex: 1; min-width: 0; }
    .portal-profile-label { font-size: 10px; font-weight: 600; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 3px; }
    .portal-profile-name { font-size: 17px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.015em; }
    .portal-profile-meta { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
    .portal-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .portal-stat { border-radius: 14px; padding: 16px 18px; border: 1px solid var(--line-soft); background: var(--bg-card); }
    .portal-stat.debt { background: var(--clay-tint); border-color: rgba(201,123,92,0.2); }
    .portal-stat.credit { background: var(--sage-tint); border-color: rgba(122,139,111,0.2); }
    .portal-stat-label { font-size: 10px; color: var(--ink-faint); font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .06em; }
    .portal-stat-val { font-size: 17px; font-weight: 700; color: var(--ink-soft); letter-spacing: -0.015em; }
    .portal-stat.debt .portal-stat-val { color: var(--clay); }
    .portal-stat.credit .portal-stat-val { color: var(--sage-deep); }
    /* list items */
    .portal-list-item { border: 1px solid var(--line-soft); border-radius: 14px; overflow: hidden; background: var(--bg-card); }
    .portal-list-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; cursor: pointer; background: var(--bg-card); min-height: 54px; }
    .portal-list-no { font-weight: 600; font-size: 13px; color: var(--ink); min-height: 16px; letter-spacing: -0.01em; }
    .portal-list-date { font-size: 11px; color: var(--ink-faint); margin-top: 2px; min-height: 14px; }
    .portal-list-total { font-weight: 700; font-size: 14px; color: var(--ink); white-space: nowrap; letter-spacing: -0.015em; }
    .portal-list-detail { border-top: 1px solid var(--line-soft); padding: 12px 18px; display: flex; flex-direction: column; gap: 6px; background: var(--bg-muted); }
    .portal-list-product { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); }
    .portal-status { font-size: 11px; font-weight: 600; border-radius: var(--radius-pill); padding: 4px 12px; }
    .portal-payment-item { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--line-soft); border-radius: 14px; padding: 14px 16px; background: var(--bg-card); }
    .portal-pay-amount { font-weight: 700; font-size: 15px; color: var(--sage-deep); letter-spacing: -0.015em; }
    .portal-pay-date { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
    .portal-pay-icon { width: 38px; height: 38px; border-radius: 50%; background: var(--sage-tint); display: flex; align-items: center; justify-content: center; color: var(--sage-deep); font-size: 16px; font-weight: 700; flex-shrink: 0; }
    .portal-empty { text-align: center; padding: 48px 20px; color: var(--ink-faint); font-size: 14px; font-weight: 500; }
    .portal-loading { text-align: center; padding: 48px 20px; color: var(--ink-faint); font-size: 14px; }
    /* ── Tab bar (legacy) ─────────────────────── */
    .tab-bar { display: flex; border-bottom: 1px solid var(--line-soft); }
    .tab-btn { flex: 1; padding: 12px 4px; border: none; background: transparent; font-size: 12px; color: var(--ink-faint); font-weight: 500; border-bottom: 2px solid transparent; transition: all .2s; }
    .tab-btn.active { color: var(--sage-deep); font-weight: 600; border-bottom-color: var(--sage); }

    /* ── Responsive tweaks ─────────────────── */
    @media (max-width: 640px) {
      .header-inner { padding: 0 16px; height: 60px; gap: 12px; }
      .header-logo  { font-size: 18px; }
      .header-search { height: 40px; }
      .page-body    { padding: 24px 16px 100px; }
      .page-title   { font-size: 26px; margin-bottom: 20px; }
      .cat-bar      { top: 60px; }
      .cat-bar-sub  { top: auto; }
      .cat-bar-inner{ padding: 10px 16px; gap: 12px; }
      .cat-chip { height: 58px; padding: 10px 18px 10px 8px; font-size: 13px; gap: 10px; }
      .cat-chip-thumb { width: 44px; height: 44px; }
      .cat-bar-stuck .cat-chip { height: 40px; padding: 6px 14px 6px 6px; font-size: 12px; gap: 6px; }
      .cat-bar-stuck .cat-chip-thumb { width: 26px; height: 26px; }
      .cat-chip-sub { height: 32px; padding: 0 14px; font-size: 12px; }
      .product-name { font-size: 13px; }
      .product-price{ font-size: 15px; }
      .icon-btn { width: 40px; height: 40px; }
      .login-btn { height: 36px; padding: 0 14px; font-size: 12px; }
      .avatar-btn { width: 36px; height: 36px; font-size: 13px; }
      .add-btn { height: 40px; font-size: 12.5px; }
    }
    @media (max-width: 480px) {
      .header-search { display: none; }
      .mobile-search-shown .header-search { display: flex; position: absolute; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); max-width: none; }
    }

    /* ── Bottom Nav ──────────────────────────── */
    .bottom-nav {
      position: fixed; bottom: 18px; left: 50%;
      transform: translateX(-50%);
      width: 75%; max-width: 380px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-pill);
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 16px;
      z-index: 9000; gap: 4px;
      box-shadow: 0 8px 32px rgba(43,38,32,0.12), 0 2px 8px rgba(43,38,32,0.06);
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      flex: 1; border: none; background: transparent; padding: 6px 0;
      border-radius: 20px; cursor: pointer; color: var(--ink-faint);
      transition: all .25s ease; -webkit-tap-highlight-color: transparent;
    }
    .nav-icon-wrap {
      position: relative; display: flex; align-items: center; justify-content: center;
      width: 44px; height: 30px; border-radius: 14px; transition: .3s ease;
    }
    .nav-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; transition: .3s ease; }
    .nav-label {
      font-size: 9.5px; font-weight: 600; margin-top: 3px; color: currentColor;
      letter-spacing: .02em; transition: transform .25s ease;
    }
    .nav-btn.nav-active { color: var(--sage-deep); }
    .nav-btn.nav-active .nav-icon-wrap {
      background: var(--sage-tint);
    }
    .nav-btn:active .nav-icon-wrap { transform: scale(.88); }
    @media (hover: hover) {
      .nav-btn:hover { color: var(--ink); }
      .nav-btn:hover .nav-icon-wrap {
        background: var(--bg-soft);
        transform: translateY(-2px);
      }
      .nav-btn:hover svg { transform: scale(1.1); }
      .nav-btn.nav-active:hover .nav-icon-wrap { background: var(--sage-tint); }
      .nav-btn:hover .nav-label { transform: translateY(1px); }
    }
    .nav-cart-badge {
      position: absolute; top: -3px; right: 2px;
      background: var(--clay);
      color: #fff; font-size: 9px; font-weight: 700;
      min-width: 16px; height: 16px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 4px; border: 2px solid var(--bg);
      opacity: 0; transform: scale(.5);
      transition: .3s cubic-bezier(.175,.885,.32,1.275);
      font-family: 'Montserrat', sans-serif;
    }
    .nav-cart-badge.show { opacity: 1; transform: scale(1); }
    @keyframes navBounce {
      0%{transform:scale(1)} 40%{transform:scale(1.4)} 60%{transform:scale(.85)} 80%{transform:scale(1.1)} 100%{transform:scale(1)}
    }
    .nav-bounce { animation: navBounce .5s cubic-bezier(.25,.8,.25,1); }

    /* ── Category Drawer ─────────────────────── */
    .drawer-overlay {
      position: fixed; inset: 0;
      background: rgba(43,38,32,0.4); z-index: 9990;
      opacity: 0; transition: opacity .3s ease;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }
    .cat-drawer {
      position: fixed; top: 0; right: 0;
      width: 86%; max-width: 380px; height: 100vh;
      background: rgba(250,247,242,0.97);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      z-index: 9995; display: flex; flex-direction: column;
      box-shadow: -12px 0 45px rgba(43,38,32,0.15);
      transform: translateX(100%); visibility: hidden;
      transition: transform .35s cubic-bezier(.4,0,.2,1), visibility .35s;
    }
    .cat-drawer.open { transform: translateX(0); visibility: visible; }
    .cat-drawer-head {
      padding: 32px 20px 16px;
      background: rgba(250,247,242,0.85);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line-soft);
    }
    .cat-drawer-head h2 {
      font-family: 'Montserrat', -apple-system, sans-serif;
      font-size: 28px; font-weight: 700; color: var(--ink);
      margin: 0 0 18px; letter-spacing: -0.025em;
    }
    .cat-drawer-search {
      position: relative; border-radius: var(--radius-pill);
    }
    .cat-drawer-search::before {
      content: ''; position: absolute; inset: 0;
      background: var(--bg-card); border: 1px solid var(--line);
      border-radius: var(--radius-pill); z-index: 1;
      transition: border-color .2s;
    }
    .cat-drawer-search:focus-within::before { border-color: var(--sage); box-shadow: 0 0 0 3px var(--sage-tint); }
    .cat-drawer-search input {
      position: relative; z-index: 2;
      width: 100%; padding: 14px 20px;
      border-radius: var(--radius-pill); border: none; background: transparent;
      color: var(--ink); font-size: 14px; font-weight: 500; outline: none;
      box-sizing: border-box;
    }
    .cat-drawer-list { flex: 1; overflow-y: auto; padding: 16px 16px 100px; }
    .drawer-cat-item {
      background: var(--bg-card); border-radius: 16px; margin-bottom: 10px;
      box-shadow: var(--shadow-soft); overflow: hidden;
      border: 1px solid var(--line-soft);
    }
    .drawer-cat-btn {
      width: 100%; display: flex; align-items: center; padding: 16px 18px;
      border: none; background: transparent; cursor: pointer; text-align: left;
      font-size: 14.5px; font-weight: 600; color: var(--ink); font-family: inherit;
      transition: background .2s;
      letter-spacing: -0.01em;
    }
    .drawer-cat-btn:hover { background: var(--sage-tint); }
    .drawer-cat-btn.dc-active { background: var(--sage-tint); color: var(--sage-deep); }
    .drawer-cat-btn .dc-label { flex: 1; }
    .dc-thumb { width: 36px; height: 36px; border-radius: 10px; object-fit: cover; flex-shrink: 0; margin-right: 12px; }
    .dc-sub .dc-thumb { width: 28px; height: 28px; border-radius: 8px; margin-right: 0; }
    .drawer-cat-btn .dc-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--sage); opacity: 0; flex-shrink: 0;
      transition: opacity .2s;
    }
    .drawer-cat-btn.dc-active .dc-dot { opacity: 1; }
    /* expandable parent → sub */
    .dc-chevron {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
      background: var(--bg-muted); color: var(--ink-faint); display: flex; align-items: center; justify-content: center;
      transition: transform .2s, background .2s, color .2s;
    }
    .dc-chevron.open { background: var(--sage); color: #fff; transform: rotate(180deg); }
    .dc-sub {
      width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 18px;
      border: none; border-top: 1px solid var(--line-soft); background: transparent; cursor: pointer;
      text-align: left; font-size: 13.5px; font-weight: 500; color: var(--ink-soft); font-family: inherit;
      transition: background .15s;
      letter-spacing: -0.01em;
    }
    .dc-sub:hover { background: var(--sage-tint); color: var(--sage-deep); }
    .dc-sub.dc-active { background: var(--sage-tint); color: var(--sage-deep); font-weight: 600; }
    .dc-sub .dc-bar { width: 3px; height: 16px; border-radius: 2px; background: var(--line); flex-shrink: 0; }
    .dc-sub.dc-active .dc-bar { background: var(--sage); }
    .dc-sub .dc-label { flex: 1; }

    @media (max-width: 640px) {
      .cat-drawer { width: 82%; max-width: 320px; }
      .cat-drawer-head { padding: 22px 16px 12px; }
      .cat-drawer-head h2 { font-size: 22px; margin-bottom: 12px; }
      .cat-drawer-search input { padding: 12px 16px; font-size: 13px; }
      .cat-drawer-list { padding: 12px 12px 90px; }
      .drawer-cat-item { border-radius: 14px; margin-bottom: 8px; }
      .drawer-cat-btn { padding: 13px 15px; font-size: 13px; }
      .dc-thumb { width: 28px; height: 28px; border-radius: 8px; margin-right: 10px; }
      .dc-sub .dc-thumb { width: 22px; height: 22px; }
      .dc-sub { padding: 11px 15px; font-size: 12.5px; gap: 10px; }
      .dc-chevron { width: 22px; height: 22px; }
    }

    /* ── Magic orb ───────────────────────────── */
    .magic-orb {
      position: fixed; z-index: 99999;
      width: 18px; height: 18px;
      background: var(--sage); border-radius: 50%;
      box-shadow: 0 0 15px 5px rgba(122,139,111,0.6);
      pointer-events: none;
      transition: top .6s cubic-bezier(.5,-.5,.2,1), left .6s cubic-bezier(.2,.8,.2,1),
                  transform .6s ease, opacity .6s ease;
    }

    /* extra bottom padding for nav */
    .page-body { padding-bottom: 110px !important; }

    /* ── Kategoriya chip rasmi ── */
    .cat-chip-thumb {
      width: 48px; height: 48px; border-radius: 10px; object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(43,38,32,0.08);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                  width 0.22s cubic-bezier(0.22, 0.61, 0.36, 1), height 0.22s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .cat-bar-stuck .cat-chip-thumb {
      width: 28px; height: 28px; border-radius: 8px;
    }
    .cat-chip:hover .cat-chip-thumb {
      transform: scale(1.06);
    }

    /* ── Sub-kategoriyasi bor chip'lardagi strelka ── */
    .cat-chip-arrow {
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--ink-faint); flex-shrink: 0; margin-left: -4px; padding: 4px; border-radius: 50%;
      transition: color 0.3s ease, background-color 0.2s ease, transform 0.2s ease;
    }
    .cat-chip:hover .cat-chip-arrow, .cat-chip.active .cat-chip-arrow { color: var(--ink-soft); }
    .cat-chip-arrow:hover { background: rgba(43,38,32,0.06); }
    .cat-chip-arrow.open { transform: rotate(180deg); color: var(--ink); }

    /* ── Sub-kategoriya dropdown (chip strelkasi bosilganda) ── */
    .cat-subdrop-overlay { position: fixed; inset: 0; z-index: 150; }
    .cat-subdrop {
      position: fixed; z-index: 151; min-width: 220px;
      background: var(--bg-card); border-radius: 16px; box-shadow: var(--shadow-float);
      border: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 2px;
      animation: popIn .22s cubic-bezier(.34,1.4,.64,1) both;
    }
    .cat-subdrop-item {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 10px 12px; border-radius: 10px; border: none; background: transparent;
      font-size: 14px; font-weight: 500; color: var(--ink); text-align: left; cursor: pointer;
      font-family: inherit; transition: background .15s;
      letter-spacing: -0.01em;
    }
    .cat-subdrop-item:hover { background: var(--sage-tint); color: var(--sage-deep); }
    .cat-subdrop-thumb { width: 30px; height: 30px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }

    /* ── Banner karusel ── */

<body>
<div id="root"></div>
<script type="module">
import React, { useState, useEffect, useMemo, useRef } from 'https://esm.sh/react@18.2.0'
import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client'
import htm from 'https://esm.sh/htm@3.1.1'
const html = htm.bind(React.createElement)

const { API_URL, STOREFRONT_KEY } = window.STORE_CONFIG
const HDR = { 'Content-Type': 'application/json', 'X-Storefront-Key': STOREFRONT_KEY }
const ACCENT = '#7a8b6f', AD = '#5d6e54'

// Mahsulot butunlay tugaganmi (variant/birlikdan qat'i nazar)
const isOutOfStock = p => (p.has_variants && p.variants?.length)
  ? !p.in_stock
  : (p.stock_type === 'tracked' && (p.stock ?? 0) <= 0)

const som   = n => { const v = Math.round(+n||0); return v.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' so\'m' }
// Narxni O'Z valyutasida: USD → "$50", aks holda so'm.
const money = (n, cur) => {
  if (!cur || cur === '' || cur === 'UZS') return som(n)
  const v = Math.round((+n||0)*100)/100
  let i, d
  if (Number.isInteger(v)) { i = v.toString(); d = '' } else { [i, d] = v.toFixed(2).split('.') }
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ')
  return (cur === 'USD' ? '$' : cur + ' ') + i + (d ? '.' + d : '')
}
// Savat jami — valyuta bo'yicha guruhlab ("$52  +  300 000 so'm")
const groupTotal = (items) => {
  const t = {}
  ;(items || []).forEach(it => { const c = it.currency || ''; t[c] = (t[c] || 0) + (it.cur_price ?? it.price) * it.qty })
  const e = Object.entries(t)
  return e.length ? e.map(([c, v]) => money(v, c)).join('  +  ') : som(0)
}
// Koordinatani manzil matniga (OpenStreetMap Nominatim — bepul, kalitsiz).
const reverseGeocode = async (lat, lng) => {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&accept-language=uz,ru`, { headers:{ 'Accept':'application/json' } })
    if (!r.ok) return null
    const d = await r.json()
    return d.display_name || null
  } catch { return null }
}
// Og'irlik/o'lchov birlikmi (kg, gramm) — kasr miqdor bilan sotiladi
const isWeightUnit = name => /kilogram|kilogramm|gramm|\bkg\b|\bg\b/i.test((name||'').trim())
// Miqdorni ko'rsatish: butun bo'lsa "2", kasr bo'lsa "0.5"
const fmtQty = n => Number.isInteger(+n) ? String(+n) : String(+(+n).toFixed(3))
const PM_LABELS = { cash:'Naqd', card:'Karta', transfer:"O'tkazma", credit:'Nasiya', mixed:'Aralash', click:'Click', payme:'Payme', uzum:'Uzum', humo:'Humo', uzcard:'UzCard', installment:"Bo'lib to'lash", exchange_credit:'Ayirboshlash' }
const pmLabel = m => PM_LABELS[m] || (m || '—')
const media = u => !u ? '' : u.startsWith('http') ? u : API_URL.replace(/\/api\/?$/,'') + u
// Bir xil narxdagi mahsulotni tez topish uchun taxminiy narx
const approxPrice = p => p.units?.[0]?.price ?? p.variants?.[0]?.price ?? 0
// O'xshash mahsulotlar: bir xil kategoriya (avval o'z kategoriyasi, keyin ota-kategoriya),
// narxi yaqinroqlari birinchi bo'lib chiqadi. Backend chaqiruvisiz, xotiradagi ro'yxatdan.
const similarProducts = (p, all, limit=10) => {
  if (!p) return []
  const sameCat = [], sameParent = []
  for (const x of all) {
    if (x.id === p.id) continue
    if (p.category_id && x.category_id === p.category_id) sameCat.push(x)
    else if (p.category_parent_id && x.category_parent_id === p.category_parent_id) sameParent.push(x)
  }
  const basePrice = approxPrice(p)
  const byCloseness = list => [...list].sort((a,b) => Math.abs(approxPrice(a)-basePrice) - Math.abs(approxPrice(b)-basePrice))
  return [...byCloseness(sameCat), ...byCloseness(sameParent)].slice(0, limit)
}
// Qidiruvga aniq mos kelmagan taqdirda: nom/kategoriya so'zlari mos kelgan mahsulotlarni taklif qilish
const searchSuggestions = (query, all, limit=8) => {
  const words = query.toLowerCase().trim().split(/\s+/).filter(Boolean)
  if (!words.length) return []
  const scored = []
  for (const p of all) {
    const hay = (p.name+' '+(p.category_name||'')+' '+(p.category_parent_name||'')).toLowerCase()
    const score = words.reduce((s,w) => s + (hay.includes(w) ? 1 : 0), 0)
    if (score > 0) scored.push([p, score])
  }
  scored.sort((a,b) => b[1]-a[1])
  return scored.slice(0, limit).map(s => s[0])
}
// Hozircha do'konda banner yuklanmagan bo'lsa ko'rsatiladigan namuna rasmlar

// ── Magic orb animation ────────────────────────────────────────────────
function magicOrb(fromEl, toEl) {
  if (!fromEl || !toEl) return
  const fr = fromEl.getBoundingClientRect()
  const tr = toEl.getBoundingClientRect()
  const orb = document.createElement('div')
  orb.className = 'magic-orb'
  orb.style.top  = (fr.top  + fr.height  / 2 - 9) + 'px'
  orb.style.left = (fr.left + fr.width / 2 - 9) + 'px'
  document.body.appendChild(orb)
  void orb.offsetWidth
  orb.style.top     = (tr.top  + tr.height  / 2 - 9) + 'px'
  orb.style.left    = (tr.left + tr.width / 2 - 9) + 'px'
  orb.style.transform = 'scale(0.3)'
  orb.style.opacity   = '0.5'
  setTimeout(() => { orb.remove() }, 650)
}

// ── ProductDetail ─────────────────────────────────────────────────────
function ProductDetail({ product, onClose, onAdd, onAddVariant, cart, allProducts, setCartQty, showImages, onSelect }) {
  const p = product
  const hasVariants = !!(p.has_variants && p.variants?.length)
  const similar = useMemo(() => similarProducts(p, allProducts||[], 10), [p, allProducts])

  const _firstInStock = hasVariants
    ? (p.variants.find(v => v.in_stock) || p.variants[0])
    : null
  const [variantId, setVariantId] = useState(_firstInStock?.id ?? null)

  const _firstAvail = !hasVariants && p.stock_type === 'tracked'
    ? (p.units?.find(u => Math.floor(p.stock / (u.multiplier||1)) > 0) || p.units?.[0])
    : p.units?.[0]
  const [unitId, setUnitId] = useState(_firstAvail?.unit_id ?? null)
  const [qty,    setQty]    = useState(1)
  const [added,  setAdded]  = useState(false)
  const addRef = useRef(null)

  const selVariant = hasVariants ? (p.variants.find(v => v.id === variantId) || p.variants[0]) : null
  const unit = !hasVariants ? (p.units?.find(u => u.unit_id === unitId) || p.units?.[0]) : null

  const displayPrice    = hasVariants ? (selVariant?.price ?? 0) : (unit?.price ?? 0)
  const displayOrigPrice = hasVariants ? (selVariant?.original_price ?? null) : (unit?.original_price ?? null)
  // Valyuta: USD tovar $ da, aks holda so'm
  const dispCur = hasVariants ? (selVariant?.currency ?? '') : (unit?.currency ?? '')
  const dispVal = hasVariants ? (selVariant?.cur_price ?? displayPrice) : (unit?.cur_price ?? displayPrice)
  const dispOrigVal = hasVariants ? (selVariant?.cur_original_price ?? null) : (unit?.cur_original_price ?? null)
  const mult   = unit?.multiplier || 1
  const isWeight = !hasVariants && isWeightUnit(unit?.unit_name)  // kg tovar — kasr miqdor
  const maxQty = hasVariants
    ? (selVariant?.in_stock ? (selVariant.stock != null ? Math.floor(selVariant.stock) : Infinity) : 0)
    : (p.stock_type === 'tracked' ? (isWeight ? p.stock / mult : Math.floor(p.stock / mult)) : Infinity)
  const cartKey = hasVariants ? `${p.id}_v${variantId}` : `${p.id}_${unit?.unit_id??'base'}`
  const inCart = cart.find(x => x.key === cartKey)?.qty || 0
  const out    = maxQty <= 0

  const handleAdd = () => {
    if (out || added) return
    const q = isWeight ? Math.max(0.001, +qty || 0) : Math.max(1, Math.round(+qty || 1))
    if (!q) return
    if (hasVariants) {
      onAddVariant(p, selVariant, q, addRef.current)
    } else {
      onAdd(p, unit, addRef.current, q)   // addToCart endi qty qabul qiladi (kasr ham)
    }
    setAdded(true)
    setTimeout(() => setAdded(false), 1400)
  }

  useEffect(() => { document.body.style.overflow = 'hidden'; return () => { document.body.style.overflow = '' } }, [])

  return html`
    <div className="detail-overlay">
      <div className="detail-topbar">
        <button className="detail-back" onClick=${onClose}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          Boshqa mahsulotlar
        </button>
        <button className="detail-close-btn" onClick=${onClose}>✕</button>
      </div>

      <div className="detail-body">
        <!-- Image -->
        <div className="detail-img-side">
          ${p.image
            ? html`<img src=${media(p.image)} alt=${p.name}/>`
            : html`<${IBox} s=${100}/>`}
        </div>

        <!-- Info -->
        <div className="detail-info-side">
          ${p.category_name && html`<div className="detail-cat">${p.category_name}</div>`}
          <h1 className="detail-name">${p.name}</h1>
          <div className="detail-price">
            ${dispOrigVal && html`<span className="price-orig-strike">${money(dispOrigVal, dispCur)}</span>`}
            ${money(dispVal, dispCur)}
            ${p.discount_percent > 0 && html`<span className="disc-badge">−${Math.round(p.discount_percent)}%</span>`}
          </div>

          <!-- Variant picker -->
          ${hasVariants && html`
            <div className="detail-unit-label">Variant tanlang</div>
            <div className="detail-unit-select">
              ${p.variants.map(v => html`
                <button key=${v.id}
                  className=${'detail-unit-chip variant-chip'+(variantId===v.id?' active':'')+(v.in_stock?'':' unavailable')}
                  onClick=${()=>{ if(v.in_stock){setVariantId(v.id);setQty(1)} }}>
                  <span className="vc-name">${v.name}</span>
                  ${(v.cur_original_price ?? v.original_price) != null && html`<span className="vc-orig">${money(v.cur_original_price ?? v.original_price, v.currency)}</span>`}
                  <span className="vc-price">${money(v.cur_price ?? v.price, v.currency)}</span>
                  ${v.stock!=null ? html`<span className="vc-stock">${Math.floor(v.stock)} ta</span>` : null}
                  ${!v.in_stock ? html`<span className="vc-out">Tugadi</span>` : null}
                </button>`)}
            </div>`}

          <!-- Unit chips (non-variant) -->
          ${!hasVariants && p.units?.length > 1 && html`
            <div className="detail-unit-label">Birlik tanlang</div>
            <div className="detail-unit-select">
              ${p.units.map(u => html`
                <button key=${u.unit_id}
                  className=${'detail-unit-chip'+(unitId===u.unit_id?' active':'')}
                  onClick=${()=>{setUnitId(u.unit_id);setQty(1)}}>
                  ${u.unit_name}
                </button>`)}
            </div>`}

          <!-- Stock -->
          ${hasVariants && !out && selVariant?.stock != null && html`
            <div className="detail-stock ok">✓ Stokda: ${Math.floor(selVariant.stock)} ta</div>`}
          ${hasVariants && out && html`
            <div className="detail-stock out">❌ Stokda yo'q</div>`}
          ${!hasVariants && p.stock_type === 'tracked' && html`
            <div className=${'detail-stock'+(out?' out':' ok')}>
              ${out ? '❌ Stokda yo\'q' : '✓ Stokda: '+fmtQty(maxQty)+' '+(unit?.unit_name||'dona')}
            </div>`}

          <!-- In cart badge -->
          ${inCart > 0 && html`
            <div className="detail-added-badge">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              Savatda: ${fmtQty(inCart)} ${isWeight ? (unit?.unit_name||'kg') : 'ta'}
            </div>`}

          <!-- Qty + Add -->
          <div className="detail-controls">
            ${isWeight
              ? html`<div className="detail-qty-wrap weight">
                  <input type="number" step="0.001" min="0" className="detail-qty-input"
                    defaultValue="1" placeholder="0.5"
                    onInput=${e=>setQty(+e.target.value||0)}/>
                  <span className="detail-qty-unit">${unit?.unit_name||'kg'}</span>
                </div>`
              : html`<div className="detail-qty-wrap">
                  <button className="detail-qty-btn" onClick=${()=>setQty(q=>Math.max(1,q-1))}>−</button>
                  <span className="detail-qty-num">${qty}</span>
                  <button className="detail-qty-btn" onClick=${()=>setQty(q=>maxQty===Infinity?q+1:Math.min(q+1,maxQty-inCart))}>+</button>
                </div>`}
            <button ref=${addRef} className=${'detail-add-btn'+(added?' btn-added':'')} onClick=${handleAdd} disabled=${out}>
              ${added
                ? html`<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> Qo'shildi!`
                : html`<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.55 13c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.37-.66-.11-1.48-.87-1.48H5.21l-.94-2H1v2h2l3.6 7.59-1.35 2.44C5.18 13.55 5 13.76 5 14c0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45zM7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg> ${out ? 'Stokda yo\'q' : 'Savatga qo\'shish'}`}
            </button>
          </div>

          <!-- Description -->
          ${p.description && html`<p className="detail-desc">${p.description}</p>`}
        </div>
      </div>

      <!-- Similar products -->
      ${similar.length > 0 && html`
        <div className="detail-similar">
          <div className="detail-similar-title">O'xshash mahsulotlar</div>
          <div className="detail-similar-rail">
            ${similar.map(sp => html`
              <div className="detail-similar-item" key=${sp.id}>
                <${ProductItem} p=${sp} onAdd=${onAdd} setQty=${setCartQty} cart=${cart} showImages=${showImages} onDetail=${onSelect}/>
              </div>`)}
          </div>
        </div>`}
    </div>`
}

// ── CategoryDrawer ────────────────────────────────────────────────────
function CategoryDrawer({ open, onClose, cats, selTop, selSub, onSelect, catImgs }) {
  const [q, setQ] = useState('')
  const [exp, setExp] = useState({})
  const ql = q.trim().toLowerCase()
  const childrenOf = id => cats.filter(c => c.parentId === id)
  const pick = (top, sub) => { onSelect(top, sub); onClose() }

  let tops = cats.filter(c => !c.parentId)
  if (ql) tops = tops.filter(t => t.name.toLowerCase().includes(ql) || childrenOf(t.id).some(s => s.name.toLowerCase().includes(ql)))

  return html`<${React.Fragment}>
    <div className=${'drawer-overlay'+(open?' open':'')} onClick=${onClose}></div>
    <div className=${'cat-drawer'+(open?' open':'')}>
      <div className="cat-drawer-head">
        <h2>Katalog</h2>
        <div className="cat-drawer-search">
          <input value=${q} onInput=${e=>setQ(e.target.value)} placeholder="Bo'limlarni qidirish..."/>
        </div>
      </div>
      <div className="cat-drawer-list">
        ${tops.map(t => {
          const subs = childrenOf(t.id)
          const parentActive = selTop===t.id && selSub==null
          if (subs.length === 0) return html`
            <div key=${t.id} className="drawer-cat-item">
              <button className=${'drawer-cat-btn'+(parentActive?' dc-active':'')} onClick=${()=>pick(t.id,null)}>
                ${catImgs[t.id] && html`<img className="dc-thumb" src=${media(catImgs[t.id])} alt=""/>`}
                <span className="dc-label">${t.name}</span>
                <span className="dc-dot"></span>
              </button>
            </div>`
          const isOpen = exp[t.id] || (ql && subs.some(s=>s.name.toLowerCase().includes(ql)))
          const vSubs = subs.filter(s => !ql || s.name.toLowerCase().includes(ql))
          return html`
            <div key=${t.id} className="drawer-cat-item">
              <button className=${'drawer-cat-btn'+(parentActive?' dc-active':'')}
                onClick=${()=>setExp(e=>({...e,[t.id]:!isOpen}))}>
                ${catImgs[t.id] && html`<img className="dc-thumb" src=${media(catImgs[t.id])} alt=""/>`}
                <span className="dc-label">${t.name}</span>
                <span className=${'dc-chevron'+(isOpen?' open':'')}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                </span>
              </button>
              ${isOpen && html`<${React.Fragment}>
                <button className=${'dc-sub'+(parentActive?' dc-active':'')} onClick=${()=>pick(t.id,null)}>
                  <span className="dc-bar"></span><span className="dc-label">Hammasi</span>
                </button>
                ${vSubs.map(s => html`
                  <button key=${s.id} className=${'dc-sub'+(selSub===s.id?' dc-active':'')} onClick=${()=>pick(t.id,s.id)}>
                    <span className="dc-bar"></span>
                    ${catImgs[s.id] && html`<img className="dc-thumb" src=${media(catImgs[s.id])} alt=""/>`}
                    <span className="dc-label">${s.name}</span>
                  </button>`)}
              </${React.Fragment}>`}
            </div>`
        })}
      </div>
    </div>
  </${React.Fragment}>`
}

// ── ProductItem ────────────────────────────────────────────────────────
function ProductItem({ p, onAdd, setQty, cart, showImages, onDetail }) {
  const hasVariants = !!(p.has_variants && p.variants?.length)

  const _firstAvail = !hasVariants && p.stock_type === 'tracked'
    ? (p.units?.find(u => Math.floor(p.stock / (u.multiplier||1)) > 0) || p.units?.[0])
    : p.units?.[0]
  const [unitId, setUnitId] = useState(_firstAvail?.unit_id ?? null)
  const [added, setAdded]   = useState(false)
  const addBtnRef = useRef(null)

  const unit   = !hasVariants ? (p.units?.find(u => u.unit_id === unitId) || p.units?.[0]) : null
  const mult   = unit?.multiplier || 1
  const maxQty = hasVariants
    ? (p.in_stock ? 1 : 0)
    : (p.stock_type === 'tracked' ? Math.floor(p.stock / mult) : Infinity)
  const cartKey = p.id+'_'+(unit?.unit_id??'base')
  const inCart = !hasVariants ? (cart.find(x => x.key === cartKey)?.qty || 0) : 0
  const out    = hasVariants ? !p.in_stock : maxQty <= 0

  const displayPrice = hasVariants
    ? (p.variants[0]?.price ?? 0)
    : (unit?.price ?? 0)
  const displayOrigPrice = hasVariants
    ? (p.variants[0]?.original_price ?? null)
    : (unit?.original_price ?? null)
  // Valyuta: USD tovar $ da, aks holda so'm
  const dispCur = hasVariants ? (p.variants[0]?.currency ?? '') : (unit?.currency ?? '')
  const dispVal = hasVariants ? (p.variants[0]?.cur_price ?? displayPrice) : (unit?.cur_price ?? displayPrice)
  const dispOrigVal = hasVariants ? (p.variants[0]?.cur_original_price ?? null) : (unit?.cur_original_price ?? null)

  const handleAdd = (e) => {
    e.stopPropagation()
    if (out || added || hasVariants) return
    onAdd(p, unit, addBtnRef.current)
    setAdded(true)
    setTimeout(() => setAdded(false), 1200)
  }

  return html`
    <div className="product-item fade-up" onClick=${()=>onDetail(p)}>
      <!-- Image -->
      <div className="product-img-wrap">
        ${showImages && p.image
          ? html`<img src=${media(p.image)} alt=${p.name} loading="lazy" onError=${e=>{e.target.style.display='none'}}/>`
          : html`<${IBox} s=${48}/>`}
        ${out && html`<div className="stock-out-overlay"><span className="stock-out-tag">Tugadi</span></div>`}
        ${inCart > 0 && html`<div className="in-cart-dot">${inCart}</div>`}
      </div>

      <!-- Name -->
      <div className="product-name clamp2">${p.name}</div>

      <!-- Meta: stock info -->
      ${!hasVariants && p.stock_type === 'tracked' && !out && html`
        <div className="product-meta">${maxQty} ${unit?.unit_name||'dona'} mavjud</div>`}
      ${out && html`<div className="product-meta" style=${{color:'#e53e3e'}}>Sotib bo'lindi</div>`}
      ${hasVariants && !out && html`
        <div className="product-meta">${p.variants.filter(v=>v.in_stock).length} variant mavjud</div>`}

      <!-- Price -->
      <div className="product-price">
        ${dispOrigVal != null && html`<span className="price-orig-strike">${hasVariants ? 'dan '+money(dispOrigVal, dispCur) : money(dispOrigVal, dispCur)}</span>`}
        ${hasVariants ? 'dan '+money(dispVal, dispCur) : money(dispVal, dispCur)}
        ${p.discount_percent > 0 && html`<span className="disc-badge">−${Math.round(p.discount_percent)}%</span>`}
      </div>

      <!-- Unit selector (non-variant only) -->
      ${!hasVariants && p.units?.length > 1 && html`
        <div className="unit-row" onClick=${e=>e.stopPropagation()}>
          <span className="unit-label">Birlik:</span>
          <div className="unit-select-wrap">
            <select className="unit-select" value=${unitId??''} onChange=${e=>setUnitId(+e.target.value)}>
              ${p.units.map(u => html`<option key=${u.unit_id} value=${u.unit_id}>${u.unit_name}</option>`)}
            </select>
            <span className="unit-caret"><${ICaret} s=${11}/></span>
          </div>
        </div>`}

      <!-- Controls -->
      <div className="controls-row" onClick=${e=>e.stopPropagation()}>
        ${hasVariants

// ── Xarita picker (Leaflet + OSM) ────────────────────────────────────────
function MapPicker({ open, initial, onPick, onClose }) {
  const boxRef = useRef(null)
  const mapRef = useRef(null)
  const ctrRef = useRef(initial && initial.lat != null ? initial : { lat:41.311081, lng:69.240562 })
  const [addr, setAddr] = useState(null)
  const [loading, setLoading] = useState(false)

  useEffect(() => {
    if (!open || !window.L || !boxRef.current) return
    const L = window.L
    const c = ctrRef.current
    const map = L.map(boxRef.current, { attributionControl:false }).setView([c.lat, c.lng], 16)
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19 }).addTo(map)
    mapRef.current = map
    let t
    const resolve = async () => {
      const p = map.getCenter()
      ctrRef.current = { lat:p.lat, lng:p.lng }
      setLoading(true)
      const a = await reverseGeocode(p.lat, p.lng)
      setAddr(a); setLoading(false)
    }
    map.on('moveend', () => { clearTimeout(t); t = setTimeout(resolve, 350) })
    setTimeout(() => { map.invalidateSize(); resolve() }, 120)
    return () => { clearTimeout(t); map.remove(); mapRef.current = null }
  }, [open])

  if (!open) return null
  const locate = () => {
    if (!navigator.geolocation) return
    navigator.geolocation.getCurrentPosition(
      p => mapRef.current && mapRef.current.setView([p.coords.latitude, p.coords.longitude], 17),
      () => {}, { enableHighAccuracy:true, timeout:15000 })
  }
  return html`
    <div style=${{position:'fixed',inset:0,zIndex:1000,background:'#000'}}>
      <div ref=${boxRef} style=${{position:'absolute',inset:0}}></div>
      <div style=${{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-100%)',pointerEvents:'none',zIndex:500,color:'#e0362a'}}><${IPin} s=${38}/></div>
      <button onClick=${onClose} style=${{position:'absolute',top:16,left:16,zIndex:600,width:44,height:44,borderRadius:22,border:'none',background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',boxShadow:'0 2px 10px rgba(0,0,0,.3)'}}><${IX} s=${18}/></button>
      <button onClick=${locate} style=${{position:'absolute',right:16,bottom:190,zIndex:600,width:46,height:46,borderRadius:23,border:'none',background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',boxShadow:'0 2px 10px rgba(0,0,0,.3)'}}><${ICrosshair} s=${20}/></button>
      <div style=${{position:'absolute',left:0,right:0,bottom:0,background:'#fff',borderRadius:'18px 18px 0 0',padding:'18px 20px calc(18px + env(safe-area-inset-bottom))',zIndex:600}}>
        <div style=${{fontSize:11,fontWeight:700,color:'#888',letterSpacing:.6,marginBottom:8}}>TANLANGAN JOY</div>
        <div style=${{background:'#f4f4f4',borderRadius:12,padding:14,fontSize:14,fontWeight:700,color:'#222',marginBottom:14,lineHeight:1.4}}>${loading ? 'Aniqlanmoqda...' : (addr || 'Manzil aniqlanmadi (koordinata saqlanadi)')}</div>
        <button onClick=${()=>onPick(ctrRef.current.lat, ctrRef.current.lng, addr)} style=${{width:'100%',height:52,border:'none',borderRadius:14,background:ACCENT,color:'#fff',fontSize:16,fontWeight:800,cursor:'pointer'}}>Shu yerni tanlash</button>
      </div>
    </div>`
}

// ── Checkout ─────────────────────────────────────────────────────────────
function Checkout({ open, onClose, total, totalStr, onSubmit, submitting, customer }) {
  const [name,  setName]  = useState(customer?.name||'')
  const [phone, setPhone] = useState(customer?.phone||'')
  const [delivery, setDelivery] = useState('courier')
  const [payment,  setPayment]  = useState('cash')
  const [address,  setAddress]  = useState('')
  const [landmark, setLandmark] = useState('')
  const [lat, setLat] = useState(null)
  const [lng, setLng] = useState(null)
  const [locating, setLocating] = useState(false)
  const [mapOpen, setMapOpen] = useState(false)
  const [err, setErr] = useState('')
  const courier = delivery === 'courier'
  if (!open) return null

  const locateMe = () => {
    if (!navigator.geolocation) { setErr("Qurilma joylashuvni qo'llamaydi"); return }
    setLocating(true); setErr('')
    navigator.geolocation.getCurrentPosition(async p => {
      setLat(p.coords.latitude); setLng(p.coords.longitude)
      const a = await reverseGeocode(p.coords.latitude, p.coords.longitude)
      if (a) setAddress(a)
      setLocating(false)
    }, () => { setLocating(false); setErr("Joylashuvga ruxsat berilmadi") }, { enableHighAccuracy:true, timeout:15000 })
  }

  const go = () => {
    if (!name.trim() || !phone.trim()) { setErr('Ism va telefon raqami majburiy'); return }
    if (courier && !address.trim() && lat == null) { setErr('Manzil kiriting yoki xaritadan belgilang'); return }
    onSubmit({
      customer_name: name.trim(), phone: phone.trim(),
      delivery_type: delivery, payment_method: payment,
      ...(courier ? { address: address.trim(), landmark: landmark.trim() } : {}),
      ...(courier && lat != null ? { latitude: lat, longitude: lng } : {}),
    })
  }

  const seg = (v,label) => html`<button onClick=${()=>setDelivery(v)} style=${{flex:1,height:48,borderRadius:12,border:'1.5px solid '+(delivery===v?ACCENT:'rgba(150,150,150,.35)'),background:delivery===v?ACCENT:'transparent',color:delivery===v?'#fff':'inherit',fontSize:15,fontWeight:600,cursor:'pointer'}}>${label}</button>`
  const payCard = (v,title,sub) => html`<button onClick=${()=>setPayment(v)} style=${{display:'flex',alignItems:'center',gap:12,width:'100%',textAlign:'left',padding:14,borderRadius:12,border:(payment===v?'2px solid '+ACCENT:'1.5px solid rgba(150,150,150,.3)'),background:'transparent',color:'inherit',cursor:'pointer'}}>
    <div style=${{flex:1}}><div style=${{fontSize:15,fontWeight:600}}>${title}</div><div style=${{fontSize:12,color:'rgba(150,150,150,.95)',marginTop:2}}>${sub}</div></div>
    <div style=${{width:20,height:20,borderRadius:10,border:'2px solid '+(payment===v?ACCENT:'rgba(150,150,150,.5)'),background:payment===v?ACCENT:'transparent',flexShrink:0}}></div>
  </button>`

  return html`
    <div className="overlay-bg fade-in">
      <div className="overlay-dim" onClick=${onClose}></div>
      <div className="bottom-sheet slide-up" style=${{maxWidth:560,margin:'0 auto'}}>
        <div className="sheet-handle"></div>
        <div className="sheet-header">
          <div className="sheet-title">Buyurtmani rasmiylashtirish</div>
          <button className="close-btn" onClick=${onClose}><${IX}/></button>
        </div>
        <div style=${{padding:'0 20px 36px',display:'flex',flexDirection:'column',gap:14,marginTop:8,flex:1,overflowY:'auto',minHeight:0}}>

          <div>
            <div className="form-label" style=${{marginBottom:8}}>YETKAZIB BERISH</div>
            <div style=${{display:'flex',gap:10}}>${seg('courier','Kuryer')} ${seg('pickup','Olib ketaman')}</div>
          </div>

          ${courier && html`
            <div className="form-field">
              <label className="form-label">Manzil</label>
              <input className="form-input" value=${address} onInput=${e=>setAddress(e.target.value)} placeholder="Ko'cha, uy, xonadon"/>
            </div>
            <div className="form-field">
              <label className="form-label">Mo'ljal (ixtiyoriy)</label>
              <input className="form-input" value=${landmark} onInput=${e=>setLandmark(e.target.value)} placeholder="Masalan: maktab yonida"/>
            </div>
            <div style=${{display:'flex',gap:10}}>
              <button onClick=${locateMe} disabled=${locating} style=${{flex:1,height:46,borderRadius:12,border:'1.5px solid rgba(150,150,150,.35)',background:'transparent',color:'inherit',fontSize:14,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>${locating?'Aniqlanmoqda...':html`<${IPin} s=${16}/> Meni topish`}</button>
              <button onClick=${()=>setMapOpen(true)} style=${{flex:1,height:46,borderRadius:12,border:'1.5px solid '+(lat!=null?ACCENT:'rgba(150,150,150,.35)'),background:lat!=null?ACCENT:'transparent',color:lat!=null?'#fff':'inherit',fontSize:14,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}><${IMapIcon} s=${16}/> Xaritadan belgilash</button>
            </div>
            ${lat!=null && html`<div style=${{fontSize:12,color:'#16a34a',fontWeight:700,marginTop:-4}}>✓ Joylashuv belgilandi</div>`}

          <div>

          <button className="primary-btn" onClick=${go} disabled=${submitting}>

        </div>
      </div>
      <${MapPicker} open=${mapOpen} initial=${lat!=null?{lat,lng}:null}

}
