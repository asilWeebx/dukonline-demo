<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
  <title>Do'kon</title>
  <link rel="icon" href="data:,">
  <script>document.write('<script src="./config.js?_='+Date.now()+'"><\/script>')</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: -apple-system, 'Inter', 'Helvetica Neue', Arial, sans-serif;
      background: #fff;
      color: #111;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    ::-webkit-scrollbar { width: 0; height: 0; }
    input, select, button, textarea { font-family: inherit; }
    input:focus, select:focus { outline: none; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }

    /* ── Utility ─────────────────────────── */
    .clamp1 { display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden; }
    .clamp2 { display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; }
    .clamp3 { display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden; }

    /* ── Animations ──────────────────────── */
    @keyframes fadeUp  { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
    @keyframes fadeIn  { from{opacity:0} to{opacity:1} }
    @keyframes popIn   { from{opacity:0;transform:scale(.94)} to{opacity:1;transform:none} }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    @keyframes slideUp { from{transform:translateY(100%)} to{transform:none} }
    .fade-up  { animation: fadeUp  .28s ease both; }
    .fade-in  { animation: fadeIn  .18s ease both; }
    .pop-in   { animation: popIn   .22s cubic-bezier(.34,1.4,.64,1) both; }
    .slide-up { animation: slideUp .3s cubic-bezier(.32,.72,0,1) both; }

    /* ── Header ──────────────────────────── */
    .site-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #f0f0f0;
    }
    .header-inner {
      max-width: 1400px; margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex; align-items: center; gap: 16px;
    }
    .header-logo {
      font-size: 18px; font-weight: 700; color: #111;
      white-space: nowrap; letter-spacing: -.3px; flex-shrink: 0;
    }
    .header-logo span { color: var(--accent); }
    .header-search {
      flex: 1; max-width: 400px;
      display: flex; align-items: center; gap: 8px;
      background: #f5f5f5; border-radius: 10px;
      padding: 0 14px; height: 40px;
    }
    .header-search input {
      flex: 1; border: none; background: transparent;
      font-size: 14px; color: #111;
    }
    .header-search input::placeholder { color: #aaa; }
    .header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }
    .icon-btn {
      position: relative; width: 40px; height: 40px;
      border-radius: 10px; border: none; background: #f5f5f5;
      display: flex; align-items: center; justify-content: center;
      color: #444; transition: background .15s;
    }
    .icon-btn:hover { background: #eee; }
    .badge {
      position: absolute; top: -4px; right: -4px;
      background: var(--accent); color: #fff;
      font-size: 10px; font-weight: 800;
      min-width: 18px; height: 18px; padding: 0 4px;
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
      border: 2px solid #fff;
    }
    .login-btn {
      height: 36px; padding: 0 16px; border-radius: 8px; border: 1.5px solid #e5e5e5;
      background: #fff; font-size: 13px; font-weight: 600; color: #333;
      transition: all .15s;
    }
    .login-btn:hover { border-color: var(--accent); color: var(--accent); }
    .avatar-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: var(--accent); color: #fff; font-weight: 700; font-size: 14px;
    }

    /* ── Category Bar ────────────────────── */
    .cat-bar {
      background: #fff; border-bottom: 1px solid #f0f0f0;
      position: sticky; top: 64px; z-index: 99;
    }
    .cat-bar-inner {
      max-width: 1400px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; gap: 6px;
      overflow-x: auto; scrollbar-width: none;
      height: 50px;
    }
    .cat-chip {
      flex-shrink: 0; height: 32px; padding: 0 16px;
      border-radius: 999px; border: 1.5px solid #e8e8e8;
      background: #fff; font-size: 13px; font-weight: 500; color: #555;
      white-space: nowrap; transition: all .15s;
    }
    .cat-chip:hover { border-color: #ccc; color: #111; }
    .cat-chip.active {
      background: #111; border-color: #111; color: #fff; font-weight: 600;
    }
    /* sub-kategoriya qatori (top'ning ostida) */
    .cat-bar-sub { top: 114px; z-index: 98; }
    .cat-bar-sub .cat-bar-inner { height: 46px; }
    .cat-chip-sub { height: 30px; font-size: 12.5px; }
    .cat-chip-sub.active {
      background: var(--accent); border-color: var(--accent); color: #fff;
    }

    /* ── Page body ───────────────────────── */
    .page-body {
      max-width: 1400px; margin: 0 auto;
      padding: 40px 24px 80px;
    }
    .page-title {
      font-size: 32px; font-weight: 800; color: #111;
      letter-spacing: -.5px; margin-bottom: 32px;
    }
    .page-title span { color: #aaa; font-weight: 400; font-size: 20px; margin-left: 10px; }

    /* ── Product Grid ────────────────────── */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 40px 24px;
    }
    @media (max-width: 1200px) { .product-grid { grid-template-columns: repeat(3,1fr); } }
    @media (max-width: 860px)  { .product-grid { grid-template-columns: repeat(2,1fr); gap: 28px 16px; } }
    @media (max-width: 480px)  { .product-grid { grid-template-columns: repeat(2,1fr); gap: 20px 12px; } }
    @media (max-width: 340px)  { .product-grid { grid-template-columns: 1fr; } }

    /* ── Product Item ─────────────────────── */
    .product-item { display: flex; flex-direction: column; gap: 0; }
    .product-img-wrap {
      position: relative;
      background: #fafafa;
      border-radius: 12px;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 14px;
      transition: background .2s;
    }
    .product-item:hover .product-img-wrap { background: #f3f3f3; }
    .product-img-wrap img {
      width: 85%; height: 85%;
      object-fit: contain;
      display: block;
      transition: transform .3s ease;
    }
    .product-item:hover .product-img-wrap img { transform: scale(1.04); }
    .product-no-img {
      width: 60px; height: 60px; opacity: .15;
    }
    .stock-out-overlay {
      position: absolute; inset: 0; border-radius: 12px;
      background: rgba(255,255,255,0.7);
      display: flex; align-items: center; justify-content: center;
    }
    .stock-out-tag {
      background: #eee; color: #aaa; font-size: 11px; font-weight: 700;
      padding: 4px 12px; border-radius: 999px; letter-spacing: .3px;
    }
    .in-cart-dot {
      position: absolute; top: 10px; right: 10px;
      background: var(--accent); color: #fff;
      font-size: 10px; font-weight: 800;
      width: 20px; height: 20px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .product-name {
      font-size: 14px; font-weight: 600; color: #111;
      line-height: 1.4; margin-bottom: 4px;
    }
    .product-meta {
      font-size: 12px; color: #aaa; margin-bottom: 6px; line-height: 1.3;
    }
    .product-price {
      font-size: 16px; font-weight: 800; color: #111;
      letter-spacing: -.2px; margin-bottom: 10px;
    }
    .unit-row {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 10px;
    }
    .unit-label { font-size: 11px; color: #aaa; font-weight: 500; }
    .unit-select-wrap { position: relative; }
    .unit-select {
      height: 28px; padding: 0 24px 0 10px;
      border: 1.5px solid #e5e5e5; border-radius: 6px;
      background: #fff; font-size: 12px; color: #333; font-weight: 500;
      -webkit-appearance: none; appearance: none; cursor: pointer;
    }
    .unit-select:focus { border-color: #ccc; }
    .unit-caret {
      position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
      pointer-events: none; color: #bbb;
    }
    .controls-row {
      display: flex; align-items: center; gap: 8px;
      margin-top: auto;
    }
    .qty-wrap {
      display: flex; align-items: center;
      border: 1.5px solid #e5e5e5; border-radius: 8px;
      overflow: hidden; flex-shrink: 0;
    }
    .qty-btn {
      width: 34px; height: 36px; border: none; background: transparent;
      font-size: 16px; color: #555; display: flex; align-items: center; justify-content: center;
      transition: background .12s; font-weight: 400;
    }
    .qty-btn:hover { background: #f5f5f5; }
    .qty-btn:active { background: #eee; }
    .qty-num {
      width: 32px; text-align: center; font-size: 14px; font-weight: 700; color: #111;
      border-left: 1.5px solid #e5e5e5; border-right: 1.5px solid #e5e5e5;
      line-height: 36px;
    }
    .add-btn {
      flex: 1; height: 36px; border-radius: 8px; border: none;
      background: var(--accent); color: #fff;
      font-size: 13px; font-weight: 700;
      box-shadow: 0 2px 8px rgba(232,160,32,.3);
      transition: all .15s; white-space: nowrap;
    }
    .add-btn:hover:not(.btn-added) { background: var(--accent-dark); box-shadow: 0 4px 14px rgba(232,160,32,.4); }
    .add-btn:active:not(.btn-added) { transform: scale(.97); }
    .add-btn:disabled { background: #f0f0f0; color: #ccc; box-shadow: none; cursor: not-allowed; }
    .add-btn.btn-added { background: #22c55e !important; color: #fff !important; box-shadow: 0 2px 8px rgba(34,197,94,.35) !important; pointer-events: none; }

    /* Skeleton */
    .skel {
      background: linear-gradient(90deg,#f5f5f5 25%,#ebebeb 50%,#f5f5f5 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 12px;
    }

    /* ── Empty / Error ────────────────────── */
    .state-center {
      grid-column: 1/-1; text-align: center; padding: 80px 20px;
    }
    .state-emoji { font-size: 48px; margin-bottom: 16px; }
    .state-text  { font-size: 15px; color: #aaa; }

    /* ── Overlay / Sheet ─────────────────── */
    .overlay-bg {
      position: fixed; inset: 0; z-index: 9100;
    }
    .overlay-dim {
      position: absolute; inset: 0; background: rgba(0,0,0,.38);
    }
    .bottom-sheet {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: #fff; border-radius: 20px 20px 0 0;
      max-height: 90vh; display: flex; flex-direction: column;
      overflow: hidden;
    }
    .sheet-handle {
      width: 36px; height: 4px; background: #e0e0e0; border-radius: 2px;
      margin: 12px auto 4px;
    }
    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 20px 14px;
    }
    .sheet-title { font-size: 17px; font-weight: 700; color: #111; }
    .close-btn {
      width: 30px; height: 30px; border-radius: 50%; border: none;
      background: #f2f2f2; display: flex; align-items: center; justify-content: center;
      color: #888;
    }
    .close-btn:hover { background: #e8e8e8; }
    .sheet-body { flex: 1; overflow-y: auto; padding: 0 0 8px; }
    .sheet-footer { padding: 12px 20px 32px; border-top: 1px solid #f0f0f0; }

    /* ── Cart ─────────────────────────────── */
    .cart-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 20px; border-bottom: 1px solid #f5f5f5;
    }
    .cart-thumb {
      width: 52px; height: 52px; border-radius: 10px;
      background: #fafafa; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .cart-thumb img { width: 100%; height: 100%; object-fit: contain; }
    .cart-info { flex: 1; min-width: 0; }
    .cart-name  { font-size: 13px; font-weight: 600; color: #111; }
    .cart-price { font-size: 12px; color: var(--accent-dark); font-weight: 700; margin-top: 2px; }
    .cart-qty-row { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .mini-btn {
      width: 28px; height: 28px; border-radius: 7px; border: 1.5px solid #e5e5e5;
      background: #fff; font-size: 14px; color: #555;
      display: flex; align-items: center; justify-content: center;
    }
    .mini-btn:hover { background: #f5f5f5; }
    .mini-qty { width: 24px; text-align: center; font-size: 13px; font-weight: 700; }

    /* ── Checkout form ─────────────────────── */
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: .5px; }
    .form-input {
      height: 46px; border: 1.5px solid #e5e5e5; border-radius: 10px;
      padding: 0 14px; font-size: 14px; color: #111; background: #fafafa;
      transition: border-color .15s;
    }
    .form-input:focus { border-color: #bbb; background: #fff; }
    .primary-btn {
      width: 100%; height: 48px; border-radius: 10px; border: none;
      background: var(--accent); color: #fff; font-size: 15px; font-weight: 700;
      box-shadow: 0 2px 10px rgba(232,160,32,.3);
      transition: all .15s;
    }
    .primary-btn:hover { background: var(--accent-dark); }
    .primary-btn:disabled { background: #f0f0f0; color: #bbb; box-shadow: none; cursor: not-allowed; }
    .dark-btn {
      width: 100%; height: 46px; border-radius: 10px; border: none;
      background: #111; color: #fff; font-size: 14px; font-weight: 700;
    }
    .err-box {
      background: #fff5f5; color: #e53e3e; border-radius: 8px;
      padding: 10px 14px; font-size: 13px;
    }
    .total-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; background: #fafafa; border-radius: 10px;
    }
    .total-label { font-size: 13px; color: #888; }
    .total-val   { font-size: 18px; font-weight: 800; color: #111; }

    /* ── Success modal ────────────────────── */
    .modal-center {
      position: fixed; inset: 0; z-index: 9200;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.45); padding: 20px;
    }
    .modal-card {
      background: #fff; border-radius: 20px; padding: 40px 28px;
      text-align: center; width: 100%; max-width: 360px;
      box-shadow: 0 20px 60px rgba(0,0,0,.15);
    }
    .success-icon {
      width: 72px; height: 72px; border-radius: 20px;
      background: linear-gradient(135deg,#4ade80,#22c55e);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px; font-size: 34px;
    }

    /* ── Customer portal ──────────────────────── */
    .portal-sheet {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: #fff; border-radius: 24px 24px 0 0;
      max-height: 88vh; display: flex; flex-direction: column;
      overflow: hidden; max-width: 560px; margin: 0 auto;
    }
    .portal-handle { width: 36px; height: 4px; background: #e0e0e0; border-radius: 2px; margin: 14px auto 0; flex-shrink: 0; }
    .portal-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px 0; flex-shrink: 0; }
    .portal-title { font-size: 20px; font-weight: 800; color: #111; }
    .portal-logout { height: 32px; padding: 0 14px; border-radius: 999px; border: none; background: #fff5f5; color: #ef4444; font-weight: 700; font-size: 12px; cursor: pointer; }
    .portal-tabs { display: flex; padding: 14px 20px 0; gap: 4px; flex-shrink: 0; border-bottom: 1px solid #f0f0f0; }
    .portal-tab { flex: 1; padding: 8px 4px 10px; border: none; background: transparent; font-size: 12px; font-weight: 600; color: #bbb; cursor: pointer; border-bottom: 2.5px solid transparent; transition: all .15s; white-space: nowrap; }
    .portal-tab.active { color: var(--accent-dark); border-bottom-color: var(--accent); }
    .portal-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 12px; }
    /* profile card — clean light */
    .portal-profile-card { background:#fff; border:1.5px solid #f0f0f0; border-radius:20px; padding:20px; display:flex; align-items:center; gap:14px; box-shadow:0 2px 12px rgba(0,0,0,.06); }
    .portal-avatar { width:52px; height:52px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; color:#fff; flex-shrink:0; }
    .portal-profile-info { flex:1; min-width:0; }
    .portal-profile-label { font-size:10px; font-weight:700; color:#bbb; text-transform:uppercase; letter-spacing:.6px; margin-bottom:2px; }
    .portal-profile-name { font-size:17px; font-weight:800; color:#111; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .portal-profile-meta { font-size:12px; color:#888; margin-top:2px; }
    .portal-stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .portal-stat { border-radius:14px; padding:14px 16px; border:1.5px solid #f0f0f0; background:#fafafa; }
    .portal-stat.debt { background:#fff5f5; border-color:#fecaca; }
    .portal-stat.credit { background:#f0fdf4; border-color:#bbf7d0; }
    .portal-stat-label { font-size:10px; color:#aaa; font-weight:700; margin-bottom:6px; text-transform:uppercase; letter-spacing:.4px; }
    .portal-stat-val { font-size:16px; font-weight:800; color:#bbb; }
    .portal-stat.debt .portal-stat-val { color:#ef4444; }
    .portal-stat.credit .portal-stat-val { color:#22c55e; }
    /* list items */
    .portal-list-item { border:1.5px solid #eeeeee; border-radius:14px; overflow:hidden; background:#fff; }
    .portal-list-row { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; cursor:pointer; background:#fff; min-height:52px; }
    .portal-list-no { font-weight:700; font-size:13px; color:#111; min-height:16px; }
    .portal-list-date { font-size:11px; color:#999; margin-top:2px; min-height:14px; }
    .portal-list-total { font-weight:800; font-size:14px; color:#111; white-space:nowrap; }
    .portal-list-detail { border-top:1px solid #f5f5f5; padding:10px 16px; display:flex; flex-direction:column; gap:6px; background:#fafafa; }
    .portal-list-product { display:flex; justify-content:space-between; font-size:12px; }
    .portal-status { font-size:11px; font-weight:700; border-radius:999px; padding:3px 10px; }
    .portal-payment-item { display:flex; justify-content:space-between; align-items:center; border:1.5px solid #eeeeee; border-radius:14px; padding:14px 16px; background:#fff; }
    .portal-pay-amount { font-weight:700; font-size:15px; color:#22c55e; }
    .portal-pay-date { font-size:11px; color:#999; margin-top:2px; }
    .portal-pay-icon { width:36px; height:36px; border-radius:50%; background:#f0fdf4; display:flex; align-items:center; justify-content:center; color:#22c55e; font-size:16px; font-weight:700; flex-shrink:0; }
    .portal-empty { text-align:center; padding:48px 20px; color:#ccc; font-size:14px; font-weight:600; }
    .portal-loading { text-align:center; padding:48px 20px; color:#bbb; font-size:14px; }
    /* ── Tab bar (legacy) ─────────────────────── */
    .tab-bar { display: flex; border-bottom: 1px solid #f0f0f0; }
    .tab-btn { flex: 1; padding: 10px 4px; border: none; background: transparent; font-size: 12px; color: #aaa; font-weight: 500; border-bottom: 2px solid transparent; transition: all .15s; }
    .tab-btn.active { color: var(--accent-dark); font-weight: 700; border-bottom-color: var(--accent); }

    /* ── Responsive tweaks ─────────────────── */
    @media (max-width: 640px) {
      .header-inner { padding: 0 16px; height: 56px; }
      .header-logo  { font-size: 16px; }
      .page-body    { padding: 24px 16px 80px; }
      .page-title   { font-size: 24px; margin-bottom: 20px; }
      .cat-bar      { top: 56px; }
      .cat-bar-sub  { top: 106px; }
      .cat-bar-inner{ padding: 0 16px; }
      .product-name { font-size: 13px; }
      .product-price{ font-size: 15px; }
    }
    @media (max-width: 480px) {
      .header-search { display: none; }
      .mobile-search-shown .header-search { display: flex; position: absolute; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); max-width: none; }
    }

    :root {
      --accent: #E8A020;
      --accent-dark: #C8880A;
      --accent-bg: rgba(232,160,32,.1);
      --coral: #ff8066;
      --coral-dark: #e96b52;
    }

    /* ── Bottom Nav ──────────────────────────── */
    .bottom-nav {
      position: fixed; bottom: 15px; left: 50%;
      transform: translateX(-50%);
      width: 75%; max-width: 380px;
      background: rgba(255,255,255,0.22);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.65);
      border-bottom: 1px solid rgba(255,255,255,0.3);
      border-radius: 40px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 18px;
      z-index: 9000; gap: 4px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.08),

<div id="root"></div>
<script type="module">
import React, { useState, useEffect, useMemo, useRef } from 'https://esm.sh/react@18.2.0'
import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client'
import htm from 'https://esm.sh/htm@3.1.1'
const html = htm.bind(React.createElement)

const { API_URL, STOREFRONT_KEY } = window.STORE_CONFIG
const HDR = { 'Content-Type': 'application/json', 'X-Storefront-Key': STOREFRONT_KEY }
const ACCENT = '#E8A020', AD = '#C8880A'

const som   = n => { const v = Math.round(+n||0); return v.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' so\'m' }
// Og'irlik/o'lchov birlikmi (kg, gramm) — kasr miqdor bilan sotiladi
const isWeightUnit = name => /kilogram|kilogramm|gramm|\bkg\b|\bg\b/i.test((name||'').trim())
// Miqdorni ko'rsatish: butun bo'lsa "2", kasr bo'lsa "0.5"
const fmtQty = n => Number.isInteger(+n) ? String(+n) : String(+(+n).toFixed(3))
const PM_LABELS = { cash:'Naqd', card:'Karta', transfer:"O'tkazma", credit:'Nasiya', mixed:'Aralash', click:'Click', payme:'Payme', uzum:'Uzum', humo:'Humo', uzcard:'UzCard', installment:"Bo'lib to'lash", exchange_credit:'Ayirboshlash' }
const pmLabel = m => PM_LABELS[m] || (m || '—')
const media = u => !u ? '' : u.startsWith('http') ? u : API_URL.replace(/\/api\/?$/,'') + u
const api   = async (p,o={}) => { const r=await fetch(API_URL+p,{...o,headers:HDR}); if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||'Xatolik'); return r.json() }

// ── SVG Icons ──────────────────────────────────────────────────────────

// ── Magic orb animation ────────────────────────────────────────────────
function magicOrb(fromEl, toEl) {
  if (!fromEl || !toEl) return
  const fr = fromEl.getBoundingClientRect()
  const tr = toEl.getBoundingClientRect()
  const orb = document.createElement('div')
  orb.className = 'magic-orb'
  orb.style.top  = (fr.top  + fr.height  / 2 - 9) + 'px'
  orb.style.left = (fr.left + fr.width / 2 - 9) + 'px'
  document.body.appendChild(orb)
  void orb.offsetWidth
  orb.style.top     = (tr.top  + tr.height  / 2 - 9) + 'px'
  orb.style.left    = (tr.left + tr.width / 2 - 9) + 'px'
  orb.style.transform = 'scale(0.3)'
  orb.style.opacity   = '0.5'
  setTimeout(() => { orb.remove() }, 650)
}

// ── ProductDetail ─────────────────────────────────────────────────────
function ProductDetail({ product, onClose, onAdd, onAddVariant, cart }) {
  const p = product
  const hasVariants = !!(p.has_variants && p.variants?.length)

  const _firstInStock = hasVariants
    ? (p.variants.find(v => v.in_stock) || p.variants[0])
    : null
  const [variantId, setVariantId] = useState(_firstInStock?.id ?? null)

  const _firstAvail = !hasVariants && p.stock_type === 'tracked'
    ? (p.units?.find(u => Math.floor(p.stock / (u.multiplier||1)) > 0) || p.units?.[0])
    : p.units?.[0]
  const [unitId, setUnitId] = useState(_firstAvail?.unit_id ?? null)
  const [qty,    setQty]    = useState(1)
  const [added,  setAdded]  = useState(false)
  const addRef = useRef(null)

  const selVariant = hasVariants ? (p.variants.find(v => v.id === variantId) || p.variants[0]) : null
  const unit = !hasVariants ? (p.units?.find(u => u.unit_id === unitId) || p.units?.[0]) : null

  const displayPrice    = hasVariants ? (selVariant?.price ?? 0) : (unit?.price ?? 0)
  const displayOrigPrice = hasVariants ? (selVariant?.original_price ?? null) : (unit?.original_price ?? null)
  const mult   = unit?.multiplier || 1
  const isWeight = !hasVariants && isWeightUnit(unit?.unit_name)  // kg tovar — kasr miqdor
  const maxQty = hasVariants
    ? (selVariant?.in_stock ? (selVariant.stock != null ? Math.floor(selVariant.stock) : Infinity) : 0)
    : (p.stock_type === 'tracked' ? (isWeight ? p.stock / mult : Math.floor(p.stock / mult)) : Infinity)
  const cartKey = hasVariants ? `${p.id}_v${variantId}` : `${p.id}_${unit?.unit_id??'base'}`
  const inCart = cart.find(x => x.key === cartKey)?.qty || 0
  const out    = maxQty <= 0

  const handleAdd = () => {
    if (out || added) return
    const q = isWeight ? Math.max(0.001, +qty || 0) : Math.max(1, Math.round(+qty || 1))
    if (!q) return
    if (hasVariants) {
      onAddVariant(p, selVariant, q, addRef.current)
    } else {
      onAdd(p, unit, addRef.current, q)   // addToCart endi qty qabul qiladi (kasr ham)
    }
    setAdded(true)
    setTimeout(() => setAdded(false), 1400)
  }

  useEffect(() => { document.body.style.overflow = 'hidden'; return () => { document.body.style.overflow = '' } }, [])

  return html`
    <div className="detail-overlay">
      <div className="detail-topbar">
        <button className="detail-back" onClick=${onClose}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          Boshqa mahsulotlar
        </button>
        <button className="detail-close-btn" onClick=${onClose}>✕</button>
      </div>

      <div className="detail-body">
        <!-- Image -->
        <div className="detail-img-side">
          ${p.image
            ? html`<img src=${media(p.image)} alt=${p.name}/>`
            : html`<${IBox} s=${100}/>`}
        </div>

        <!-- Info -->
        <div className="detail-info-side">
          ${p.category_name && html`<div className="detail-cat">${p.category_name}</div>`}
          <h1 className="detail-name">${p.name}</h1>
          <div className="detail-price">
            ${displayOrigPrice && html`<span className="price-orig-strike">${som(displayOrigPrice)}</span>`}
            ${som(displayPrice)}
            ${p.discount_percent > 0 && html`<span className="disc-badge">−${Math.round(p.discount_percent)}%</span>`}
          </div>

          <!-- Variant picker -->
          ${hasVariants && html`
            <div className="detail-unit-label">Variant tanlang</div>
            <div className="detail-unit-select">
              ${p.variants.map(v => html`
                <button key=${v.id}
                  className=${'detail-unit-chip variant-chip'+(variantId===v.id?' active':'')+(v.in_stock?'':' unavailable')}
                  onClick=${()=>{ if(v.in_stock){setVariantId(v.id);setQty(1)} }}>
                  <span className="vc-name">${v.name}</span>
                  ${v.original_price != null && html`<span className="vc-orig">${som(v.original_price)}</span>`}
                  <span className="vc-price">${som(v.price)}</span>
                  ${v.stock!=null ? html`<span className="vc-stock">${Math.floor(v.stock)} ta</span>` : null}
                  ${!v.in_stock ? html`<span className="vc-out">Tugadi</span>` : null}
                </button>`)}
            </div>`}

          <!-- Unit chips (non-variant) -->
          ${!hasVariants && p.units?.length > 1 && html`
            <div className="detail-unit-label">Birlik tanlang</div>
            <div className="detail-unit-select">
              ${p.units.map(u => html`
                <button key=${u.unit_id}
                  className=${'detail-unit-chip'+(unitId===u.unit_id?' active':'')}
                  onClick=${()=>{setUnitId(u.unit_id);setQty(1)}}>
                  ${u.unit_name}
                </button>`)}
            </div>`}

          <!-- Stock -->
          ${hasVariants && !out && selVariant?.stock != null && html`
            <div className="detail-stock ok">✓ Stokda: ${Math.floor(selVariant.stock)} ta</div>`}
          ${hasVariants && out && html`
            <div className="detail-stock out">❌ Stokda yo'q</div>`}
          ${!hasVariants && p.stock_type === 'tracked' && html`
            <div className=${'detail-stock'+(out?' out':' ok')}>
              ${out ? '❌ Stokda yo\'q' : '✓ Stokda: '+fmtQty(maxQty)+' '+(unit?.unit_name||'dona')}
            </div>`}

          <!-- In cart badge -->
          ${inCart > 0 && html`
            <div className="detail-added-badge">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              Savatda: ${fmtQty(inCart)} ${isWeight ? (unit?.unit_name||'kg') : 'ta'}
            </div>`}

          <!-- Qty + Add -->
          <div className="detail-controls">
            ${isWeight
              ? html`<div className="detail-qty-wrap weight">
                  <input type="number" step="0.001" min="0" className="detail-qty-input"
                    defaultValue="1" placeholder="0.5"
                    onInput=${e=>setQty(+e.target.value||0)}/>
                  <span className="detail-qty-unit">${unit?.unit_name||'kg'}</span>
                </div>`
              : html`<div className="detail-qty-wrap">
                  <button className="detail-qty-btn" onClick=${()=>setQty(q=>Math.max(1,q-1))}>−</button>
                  <span className="detail-qty-num">${qty}</span>
                  <button className="detail-qty-btn" onClick=${()=>setQty(q=>maxQty===Infinity?q+1:Math.min(q+1,maxQty-inCart))}>+</button>
                </div>`}
            <button ref=${addRef} className=${'detail-add-btn'+(added?' btn-added':'')} onClick=${handleAdd} disabled=${out}>
              ${added
                ? html`<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> Qo'shildi!`
                : html`<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.55 13c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.37-.66-.11-1.48-.87-1.48H5.21l-.94-2H1v2h2l3.6 7.59-1.35 2.44C5.18 13.55 5 13.76 5 14c0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45zM7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg> ${out ? 'Stokda yo\'q' : 'Savatga qo\'shish'}`}
            </button>
          </div>

          <!-- Description -->
          ${p.description && html`<p className="detail-desc">${p.description}</p>`}
        </div>
      </div>
    </div>`
}

// ── CategoryDrawer ────────────────────────────────────────────────────
function CategoryDrawer({ open, onClose, cats, selTop, selSub, onSelect }) {
  const [q, setQ] = useState('')
  const [exp, setExp] = useState({})
  const ql = q.trim().toLowerCase()
  const childrenOf = id => cats.filter(c => c.parentId === id)
  const pick = (top, sub) => { onSelect(top, sub); onClose() }

  let tops = cats.filter(c => !c.parentId)
  if (ql) tops = tops.filter(t => t.name.toLowerCase().includes(ql) || childrenOf(t.id).some(s => s.name.toLowerCase().includes(ql)))

  return html`<${React.Fragment}>
    <div className=${'drawer-overlay'+(open?' open':'')} onClick=${onClose}></div>
    <div className=${'cat-drawer'+(open?' open':'')}>
      <div className="cat-drawer-head">
        <h2>Katalog</h2>
        <div className="cat-drawer-search">
          <input value=${q} onInput=${e=>setQ(e.target.value)} placeholder="Bo'limlarni qidirish..."/>
        </div>
      </div>
      <div className="cat-drawer-list">
        <div className="drawer-cat-item">
          <button className=${'drawer-cat-btn'+(selTop===null&&selSub===null?' dc-active':'')}
            onClick=${()=>pick(null,null)}>
            <span className="dc-label">Barchasi</span>
            <span className="dc-dot"></span>
          </button>
        </div>
        ${tops.map(t => {
          const subs = childrenOf(t.id)
          const parentActive = selTop===t.id && selSub==null
          if (subs.length === 0) return html`
            <div key=${t.id} className="drawer-cat-item">
              <button className=${'drawer-cat-btn'+(parentActive?' dc-active':'')} onClick=${()=>pick(t.id,null)}>
                <span className="dc-label">${t.name}</span>
                <span className="dc-dot"></span>
              </button>
            </div>`
          const isOpen = exp[t.id] || (ql && subs.some(s=>s.name.toLowerCase().includes(ql)))
          const vSubs = subs.filter(s => !ql || s.name.toLowerCase().includes(ql))
          return html`
            <div key=${t.id} className="drawer-cat-item">
              <button className=${'drawer-cat-btn'+(parentActive?' dc-active':'')}
                onClick=${()=>setExp(e=>({...e,[t.id]:!isOpen}))}>
                <span className="dc-label">${t.name}</span>
                <span className=${'dc-chevron'+(isOpen?' open':'')}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                </span>
              </button>
              ${isOpen && html`<${React.Fragment}>
                <button className=${'dc-sub'+(parentActive?' dc-active':'')} onClick=${()=>pick(t.id,null)}>
                  <span className="dc-bar"></span><span className="dc-label">Hammasi</span>
                </button>
                ${vSubs.map(s => html`
                  <button key=${s.id} className=${'dc-sub'+(selSub===s.id?' dc-active':'')} onClick=${()=>pick(t.id,s.id)}>
                    <span className="dc-bar"></span><span className="dc-label">${s.name}</span>
                  </button>`)}
              </${React.Fragment}>`}
            </div>`
        })}
      </div>
    </div>
  </${React.Fragment}>`
}

// ── ProductItem ────────────────────────────────────────────────────────
function ProductItem({ p, onAdd, setQty, cart, showImages, onDetail }) {
  const hasVariants = !!(p.has_variants && p.variants?.length)

  const _firstAvail = !hasVariants && p.stock_type === 'tracked'
    ? (p.units?.find(u => Math.floor(p.stock / (u.multiplier||1)) > 0) || p.units?.[0])
    : p.units?.[0]
  const [unitId, setUnitId] = useState(_firstAvail?.unit_id ?? null)
  const [added, setAdded]   = useState(false)
  const addBtnRef = useRef(null)

  const unit   = !hasVariants ? (p.units?.find(u => u.unit_id === unitId) || p.units?.[0]) : null
  const mult   = unit?.multiplier || 1
  const maxQty = hasVariants
    ? (p.in_stock ? 1 : 0)
    : (p.stock_type === 'tracked' ? Math.floor(p.stock / mult) : Infinity)
  const cartKey = p.id+'_'+(unit?.unit_id??'base')
  const inCart = !hasVariants ? (cart.find(x => x.key === cartKey)?.qty || 0) : 0
  const out    = hasVariants ? !p.in_stock : maxQty <= 0

  const displayPrice = hasVariants
    ? (p.variants[0]?.price ?? 0)
    : (unit?.price ?? 0)
  const displayOrigPrice = hasVariants
    ? (p.variants[0]?.original_price ?? null)
    : (unit?.original_price ?? null)

  const handleAdd = (e) => {
    e.stopPropagation()
    if (out || added || hasVariants) return
    onAdd(p, unit, addBtnRef.current)
    setAdded(true)
    setTimeout(() => setAdded(false), 1200)
  }

  return html`
    <div className="product-item fade-up" onClick=${()=>onDetail(p)}>
      <!-- Image -->
      <div className="product-img-wrap">
        ${showImages && p.image
          ? html`<img src=${media(p.image)} alt=${p.name} loading="lazy" onError=${e=>{e.target.style.display='none'}}/>`
          : html`<${IBox} s=${48}/>`}
        ${out && html`<div className="stock-out-overlay"><span className="stock-out-tag">Tugadi</span></div>`}
        ${inCart > 0 && html`<div className="in-cart-dot">${inCart}</div>`}
      </div>

      <!-- Name -->
      <div className="product-name clamp2">${p.name}</div>

      <!-- Meta: stock info -->
      ${!hasVariants && p.stock_type === 'tracked' && !out && html`
        <div className="product-meta">${maxQty} ${unit?.unit_name||'dona'} mavjud</div>`}
      ${out && html`<div className="product-meta" style=${{color:'#e53e3e'}}>Sotib bo'lindi</div>`}
      ${hasVariants && !out && html`
        <div className="product-meta">${p.variants.filter(v=>v.in_stock).length} variant mavjud</div>`}

      <!-- Price -->
      <div className="product-price">
        ${displayOrigPrice != null && html`<span className="price-orig-strike">${hasVariants ? 'dan '+som(displayOrigPrice) : som(displayOrigPrice)}</span>`}
        ${hasVariants ? 'dan '+som(displayPrice) : som(displayPrice)}
        ${p.discount_percent > 0 && html`<span className="disc-badge">−${Math.round(p.discount_percent)}%</span>`}
      </div>

      <!-- Unit selector (non-variant only) -->
      ${!hasVariants && p.units?.length > 1 && html`
        <div className="unit-row" onClick=${e=>e.stopPropagation()}>
          <span className="unit-label">Birlik:</span>
          <div className="unit-select-wrap">
            <select className="unit-select" value=${unitId??''} onChange=${e=>setUnitId(+e.target.value)}>
              ${p.units.map(u => html`<option key=${u.unit_id} value=${u.unit_id}>${u.unit_name}</option>`)}
            </select>
            <span className="unit-caret"><${ICaret} s=${11}/></span>
          </div>
        </div>`}

      <!-- Controls -->
      <div className="controls-row" onClick=${e=>e.stopPropagation()}>
        ${hasVariants
          ? html`<button className="add-btn" style=${{flex:1}} onClick=${e=>{e.stopPropagation();onDetail(p)}}
              disabled=${out}>
              ${out ? 'Tugadi' : 'Tanlang'}
            </button>`
          : inCart > 0
            // Savatda bo'lsa — Uzumdek +/- stepper (cart qty'ni boshqaradi)
            ? html`
              <div className="qty-wrap" style=${{flex:1}}>
                <button className="qty-btn" onClick=${e=>{e.stopPropagation();setQty(cartKey, inCart-1)}}>−</button>
                <span className="qty-num">${fmtQty(inCart)}</span>
                <button className="qty-btn" onClick=${e=>{e.stopPropagation(); if(maxQty===Infinity||inCart<maxQty) onAdd(p, unit, addBtnRef.current)}}>+</button>
              </div>`
            // Savatda yo'q — bitta "Savatga" tugmasi
            : html`
              <button ref=${addBtnRef} className=${'add-btn'+(out?' btn-tugadi':added?' btn-added':'')} style=${{flex:1}} onClick=${handleAdd} disabled=${out}>
                ${out ? 'Tugadi' : added ? '✓' : 'Savatga'}
              </button>`}
      </div>
    </div>`
}

                  <div className="cart-info-new">
                    <div className="cart-name-new clamp2">${it.name}${it.variant_name ? ' · '+it.variant_name : ''}</div>
                    <div className="cart-price-new">${som(it.price * it.qty)}</div>
                    <div className="cart-unit-new">${som(it.price)} × ${fmtQty(it.qty)} ${it.unit_name}</div>
                  </div>
                  ${it.weight
                    ? html`<div className="cart-qty-ctrl">
                        <input type="number" step="0.001" min="0" className="cart-qty-input"

                          onChange=${e=>setQty(it.key, +e.target.value||0)}/>

                        <button className=${'cqb'+(it.qty===1?' cqb-del':'')}

                          ${it.qty===1?html`<${IX} s=${12}/>`:html`−`}
                        </button>
                        <span className="cqn">${it.qty}</span>
                        <button className="cqb" onClick=${()=>setQty(it.key,it.qty+1)}>+</button>
                      </div>`}
                </div>
                ${idx < items.length-1 && html`<div className="cart-divider"></div>`}
              </${React.Fragment}>`)
          }
        </div>

        <div className="cart-footer-new">
          <div className="cart-total-card">
            <span className="cart-total-lbl">Jami summa</span>

            onClick=${()=>{onClose();onCheckout()}}>

// ── Checkout ─────────────────────────────────────────────────────────────
function Checkout({ open, onClose, total, onSubmit, submitting, customer }) {
  const [name,  setName]  = useState(customer?.name||'')
  const [phone, setPhone] = useState(customer?.phone||'')
  const [err,   setErr]   = useState('')
  if (!open) return null
  const go = () => {
    if (!name.trim() || !phone.trim()) { setErr('Ism va telefon raqami majburiy'); return }
    onSubmit({ customer_name: name.trim(), phone: phone.trim() })
  }
  return html`
    <div className="overlay-bg fade-in">
      <div className="overlay-dim" onClick=${onClose}></div>
      <div className="bottom-sheet slide-up" style=${{maxWidth:560,margin:'0 auto'}}>

        <div style=${{padding:'0 20px 36px',display:'flex',flexDirection:'column',gap:14,marginTop:8}}>
          <p style=${{fontSize:13,color:'#aaa',marginBottom:4}}>Telefon raqamingizni qoldiring — do'kon siz bilan bog'lanadi.</p>
          <div className="form-field">
            <label className="form-label">Ismingiz</label>
            <input className="form-input" value=${name} onInput=${e=>setName(e.target.value)} placeholder="Ism Familiya"/>
          </div>
          <div className="form-field">
            <label className="form-label">Telefon raqam</label>
            <input className="form-input" type="tel" value=${phone} onInput=${e=>setPhone(e.target.value)} placeholder="+998 90 000 00 00"/>
          </div>
          ${err && html`<div className="err-box">${err}</div>`}
          <div className="total-row">
            <span className="total-label">Jami</span>
            <span className="total-val">${som(total)}</span>

// ── Login ──────────────────────────────────────────────────────────────────
function Login({ open, onClose, onLogin }) {
  const [code, setCode] = useState('')
  const [err,  setErr]  = useState('')
  const [busy, setBusy] = useState(false)
  if (!open) return null
  const go = async () => {
    if (!code.trim()) { setErr('ID kiriting'); return }
    setBusy(true); setErr('')
    try { onLogin(await api('/storefront/login/',{method:'POST',body:JSON.stringify({code:code.trim()})})) }
    catch(e) { setErr(e.message) } finally { setBusy(false) }
  }
  return html`
    <div className="modal-center fade-in">
      <div className="modal-card pop-in">
        <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
          <div style=${{fontWeight:700,fontSize:17,color:'#111'}}>Mijoz sifatida kirish</div>
          <button className="close-btn" onClick=${onClose}><${IX}/></button>
        </div>
        <p style=${{fontSize:13,color:'#aaa',marginBottom:20,textAlign:'left'}}>Do'kondan olgan ID raqamingizni kiriting</p>
        <input value=${code} onInput=${e=>setCode(e.target.value.toUpperCase())}
          onKeyDown=${e=>e.key==='Enter'&&go()}
          placeholder="CUST-XXXXXX"
          style=${{width:'100%',height:48,border:'1.5px solid #e5e5e5',borderRadius:10,paddingLeft:14,fontSize:15,fontFamily:'monospace',letterSpacing:2,color:'#111',background:'#fafafa',marginBottom:err?10:0}}/>
        ${err && html`<div className="err-box" style=${{marginBottom:10}}>${err}</div>`}
        <button className="primary-btn" style=${{marginTop:12}} onClick=${go} disabled=${busy}>
          ${busy ? 'Tekshirilmoqda...' : 'Kirish'}
        </button>
      </div>
    </div>`
}

// ── App ─────────────────────────────────────────────────────────────────────
function App() {
  const [info,      setInfo]     = useState(null)
  const [products,  setProds]    = useState([])
  const [cats,      setCats]     = useState([])
  const [showImages,setShowImg]  = useState(true)
  const [loading,   setLoad]     = useState(true)
  const [error,     setErr]      = useState('')

  const [search,    setSearch]   = useState('')
  const [selTop,    setSelTop]   = useState(null)
  const [selSub,    setSelSub]   = useState(null)

  const [cart,      setCart]     = useState([])
  const [cartOpen,  setCartOpen] = useState(false)
  const [chkOpen,   setChkOpen]  = useState(false)
  const [subbing,   setSubbing]  = useState(false)
  const [done,      setDone]     = useState(null)

  const [customer,  setCust]     = useState(()=>{try{return JSON.parse(localStorage.getItem('sf_cust')||'null')}catch{return null}})
  const [loginOpen, setLoginOpen]= useState(false)
  const [portalOpen,setPortal]   = useState(false)
  const [srchOpen,  setSrchOpen] = useState(false)
  const [drawerOpen,  setDrawer]    = useState(false)
  const [navActive,   setNavActive] = useState('home')
  const [detailProd,  setDetail]    = useState(null)

  const searchRef  = useRef(null)
  const navCartRef = useRef(null)

  useEffect(() => { api('/storefront/info/').then(setInfo).catch(()=>{}) }, [])

  useEffect(() => {
    setLoad(true)
    const q = customer ? '?customer_code='+encodeURIComponent(customer.customer_code) : ''
    api('/storefront/products/'+q).then(r => {
      const list = r.results || []
      setProds(list)
      setShowImg(r.show_images !== false)
      // Kategoriya daraxti: leaf (o'z parent'i bilan) + parent kategoriyalar
      const map = new Map()
      list.forEach(p => {
        if (p.category_id && p.category_name) map.set(p.category_id, {id:p.category_id, name:p.category_name, parentId:p.category_parent_id||null})
        if (p.category_parent_id && p.category_parent_name && !map.has(p.category_parent_id))
          map.set(p.category_parent_id, {id:p.category_parent_id, name:p.category_parent_name, parentId:null})
      })
      setCats([...map.values()])
    }).catch(e=>setErr(e.message)).finally(()=>setLoad(false))
  }, [customer])

  useEffect(() => { if (srchOpen && searchRef.current) searchRef.current.focus() }, [srchOpen])

  const doLogin = c => { setCust(c); localStorage.setItem('sf_cust',JSON.stringify(c)); setLoginOpen(false) }
  const logout  = () => { setCust(null); localStorage.removeItem('sf_cust') }

  const topCats = useMemo(()=>cats.filter(c=>!c.parentId), [cats])
  const subCats = useMemo(()=>selTop==null?[]:cats.filter(c=>c.parentId===selTop), [cats, selTop])

  const filtered = useMemo(() => {
    let l = products
    if (selSub)      l = l.filter(p => p.category_id === selSub)
    else if (selTop) l = l.filter(p => p.category_id === selTop || p.category_parent_id === selTop)
    if (search)      l = l.filter(p => p.name.toLowerCase().includes(search.toLowerCase()))
    return l
  }, [products, selTop, selSub, search])

  const total = cart.reduce((s,it)=>s+it.price*it.qty, 0)
  const count = cart.reduce((s,it)=>s+it.qty, 0)

  function _orbBounce(fromEl) {
    if (fromEl && navCartRef.current) {
      magicOrb(fromEl, navCartRef.current)
      setTimeout(() => {
        navCartRef.current?.classList.remove('nav-bounce')
        void navCartRef.current?.offsetWidth
        navCartRef.current?.classList.add('nav-bounce')
        setTimeout(() => navCartRef.current?.classList.remove('nav-bounce'), 550)
      }, 620)
    }
    if (navigator?.vibrate) navigator.vibrate(20)
  }

  function addToCart(p, unit, fromEl, qty=1) {
    const key  = p.id+'_'+(unit?.unit_id??'base')
    const mult = unit?.multiplier || 1
    // Og'irlik (kg) tovarda qoldiq kasr bo'lishi mumkin — floor qilmaymiz
    const weight = isWeightUnit(unit?.unit_name)
    const max  = p.stock_type==='tracked' ? (weight ? p.stock/mult : Math.floor(p.stock/mult)) : Infinity
    if (max <= 0) return
    setCart(c => {
      const ex = c.find(x=>x.key===key)
      if (ex) { if(ex.qty>=max) return c; return c.map(x=>x.key===key?{...x,qty:Math.min(x.qty+qty,max)}:x) }
      return [...c, {key,product_id:p.id,unit_id:unit?.unit_id,variant_id:null,variant_name:'',unit_name:unit?.unit_name||'dona',weight,name:p.name,price:unit?.price,qty:Math.min(qty,max),maxQty:max,image:p.image}]
    })
    _orbBounce(fromEl)
  }

  function addVariantToCart(p, variant, qty, fromEl) {
    const key = `${p.id}_v${variant.id}`
    const max = variant.stock != null ? Math.floor(variant.stock) : Infinity
    if (max <= 0) return
    setCart(c => {
      const ex = c.find(x=>x.key===key)
      if (ex) return c.map(x=>x.key===key?{...x,qty:Math.min(x.qty+qty,max)}:x)
      return [...c, {key,product_id:p.id,unit_id:null,variant_id:variant.id,variant_name:variant.name,unit_name:'dona',name:p.name,price:variant.price,qty,maxQty:max===Infinity?9999:max,image:p.image}]
    })
    _orbBounce(fromEl)
  }

  const updQty = (key,q) => setCart(c=>{ const it=c.find(x=>x.key===key); if(!it)return c; const cap=it.maxQty?Math.min(q,it.maxQty):q; return cap<=0?c.filter(x=>x.key!==key):c.map(x=>x.key===key?{...x,qty:cap}:x) })
  const remItem = key => setCart(c=>c.filter(x=>x.key!==key))

  async function submitOrder(form) {
    setSubbing(true)
    try {
      const body = {
        ...form,
        customer_code: customer?.customer_code,
        items: cart.map(it => ({
          product_id: it.product_id,
          ...(it.variant_id ? {variant_id: it.variant_id} : {}),
          ...(it.unit_id    ? {unit_id:    it.unit_id}    : {}),
          qty: it.qty,
        }))
      }
      const order = await api('/storefront/orders/',{method:'POST',body:JSON.stringify(body)})
      setCart([]); setChkOpen(false); setDone(order)
    } catch(e) { alert(e.message) } finally { setSubbing(false) }
  }

  const catName = (selSub||selTop) ? cats.find(c=>c.id===(selSub||selTop))?.name : null

  return html`<div>

    <!-- ── Header ──────────────────────────────────────────── -->
    <header className="site-header">
      <div className="header-inner">

        ${srchOpen
          ? html`<div className="header-search fade-in" style=${{maxWidth:'none',flex:1}}>
              <${ISearch} s=${16}/>
              <input ref=${searchRef} value=${search} onInput=${e=>setSearch(e.target.value)}
                placeholder="Mahsulot qidirish..." style=${{flex:1,border:'none',background:'transparent',fontSize:14,color:'#111'}}/>
            </div>
            <button className="login-btn" onClick=${()=>{setSrchOpen(false);setSearch('')}}>Bekor</button>`

          : html`<${React.Fragment}>
              <div className="header-logo">${info?.store||"Do'kon"}</div>

              <div className="header-search">
                <${ISearch} s=${16}/>
                <input value=${search} onInput=${e=>setSearch(e.target.value)} placeholder="Mahsulot qidirish..."/>
              </div>

              <div className="header-actions">
                <button className="icon-btn mobile-search-trigger" onClick=${()=>setSrchOpen(true)} title="Qidirish">
                  <${ISearch} s=${18}/>
                </button>
                <button className="icon-btn" onClick=${()=>setCartOpen(true)} title="Savat">
                  <${ICart} s=${18}/>
                  ${count>0 && html`<span className="badge">${count>9?'9+':count}</span>`}
                </button>
                ${customer
                  ? html`<button className="avatar-btn" onClick=${()=>setPortal(true)}>
                      ${customer.name.charAt(0).toUpperCase()}
                    </button>`
                  : html`<button className="login-btn" onClick=${()=>setLoginOpen(true)}>
                      Kirish
                    </button>`}
              </div>
            </${React.Fragment}>`}
      </div>
    </header>

    <!-- ── Category bar (top) ──────────────────────────────── -->
    ${topCats.length > 0 && html`
      <nav className="cat-bar">
        <div className="cat-bar-inner">
          <button className=${'cat-chip'+(selTop===null?' active':'')} onClick=${()=>{setSelTop(null);setSelSub(null)}}>
            Barchasi
          </button>
          ${topCats.map(c => html`
            <button key=${c.id} className=${'cat-chip'+(selTop===c.id?' active':'')} onClick=${()=>{setSelTop(c.id);setSelSub(null)}}>
              ${c.name}
            </button>`)}
        </div>
      </nav>`}

    <!-- ── Sub-category bar (tanlangan top'da sub bo'lsa) ───── -->
    ${subCats.length > 0 && html`
      <nav className="cat-bar cat-bar-sub">
        <div className="cat-bar-inner">
          <button className=${'cat-chip cat-chip-sub'+(selSub===null?' active':'')} onClick=${()=>setSelSub(null)}>
            Barchasi
          </button>
          ${subCats.map(c => html`
            <button key=${c.id} className=${'cat-chip cat-chip-sub'+(selSub===c.id?' active':'')} onClick=${()=>setSelSub(c.id)}>
              ${c.name}
            </button>`)}
        </div>
      </nav>`}

    <!-- ── Page body ───────────────────────────────────────── -->
    <main className="page-body">
      <h1 className="page-title">
        ${catName || 'Katalog'}
        ${!loading && html`<span>${filtered.length} ta mahsulot</span>`}
      </h1>

      <!-- States -->
      ${loading && html`<${Skeleton}/>`}
      ${error   && html`<div className="product-grid"><div className="state-center">
        <div className="state-emoji">😕</div>
        <div className="state-text">Xatolik yuz berdi: ${error}</div>
      </div></div>`}
      ${!loading && !error && filtered.length===0 && html`<div className="product-grid"><div className="state-center">
        <div className="state-emoji">🔍</div>
        <div className="state-text">Mahsulot topilmadi</div>
      </div></div>`}

      <!-- Grid -->
      ${!loading && !error && filtered.length>0 && html`
        <div className="product-grid">
          ${filtered.map(p => html`
            <${ProductItem} key=${p.id} p=${p} onAdd=${addToCart} setQty=${updQty} cart=${cart} showImages=${showImages}
              onDetail=${setDetail}/>`)}
        </div>`}
    </main>

    <!-- ── Modals ──────────────────────────────────────────── -->
    <${CartSheet}
      open=${cartOpen} onClose=${()=>setCartOpen(false)}
      items=${cart} setQty=${updQty} remove=${remItem}
      total=${total} onCheckout=${()=>setChkOpen(true)}/>

    <${Checkout}
      open=${chkOpen} onClose=${()=>setChkOpen(false)}
      total=${total} onSubmit=${submitOrder} submitting=${subbing} customer=${customer}/>

    <${Login} open=${loginOpen} onClose=${()=>setLoginOpen(false)} onLogin=${doLogin}/>

    <${CustomerPortal}
      open=${portalOpen} onClose=${()=>setPortal(false)}
      customer=${customer} onLogout=${logout}/>

    ${done && html`<${Success} order=${done} onClose=${()=>setDone(null)}/>`}

    <!-- ── Product Detail ───────────────────── -->
    ${detailProd && html`<${ProductDetail}
      product=${detailProd}
      onClose=${()=>setDetail(null)}
      onAdd=${addToCart}
      onAddVariant=${addVariantToCart}
      cart=${cart}/>`}

    <!-- ── Category Drawer ───────────────────── -->
    <${CategoryDrawer}
      open=${drawerOpen} onClose=${()=>setDrawer(false)}
      cats=${cats} selTop=${selTop} selSub=${selSub}
      onSelect=${(top,sub)=>{setSelTop(top);setSelSub(sub);setNavActive('home')}}/>

    <!-- ── Bottom Nav ────────────────────────── -->
    <${BottomNav}
      active=${navActive}
      count=${count}
      cartIconRef=${navCartRef}
      onHome=${()=>{setSelTop(null);setSelSub(null);setSearch('');setSrchOpen(false);setNavActive('home');window.scrollTo({top:0,behavior:'smooth'})}}
      onSearch=${()=>{setSrchOpen(s=>!s);setNavActive('search')}}
      onCart=${()=>{setCartOpen(true);setNavActive('cart');setTimeout(()=>setNavActive('home'),300)}}
      onDrawer=${()=>{setDrawer(d=>!d);setNavActive('catalog')}}/>
  </div>`
}

// Mobile search button — hide on desktop, show on mobile
const style = document.createElement('style')
style.textContent = '.mobile-search-trigger{display:none!important}@media(max-width:640px){.mobile-search-trigger{display:flex!important}.header-search{display:none!important}}'
document.head.appendChild(style)

createRoot(document.getElementById('root')).render(html`<${App}/>`)
</script>
</body>
</html>
