function BannerCarousel({ banners }) {
  const [idx, setIdx] = useState(0)
  const timerRef = useRef(null)
  const n = banners ? banners.length : 0

  const resume = () => {
    clearInterval(timerRef.current)
    if (n > 1) timerRef.current = setInterval(() => setIdx(i => (i + 1) % n), 4000)
  }
  useEffect(() => { resume(); return () => clearInterval(timerRef.current) }, [n])
  useEffect(() => { setIdx(0) }, [banners])

  if (!n) return null
  const go = d => setIdx(i => (i + d + n) % n)

  return html`
    <div className="banner-wrap">
      <div className="banner-viewport" onMouseEnter=${()=>clearInterval(timerRef.current)} onMouseLeave=${resume}>
        <div className="banner-track" style=${{transform:`translateX(-${idx*100}%)`}}>
          ${banners.map((b,i) => {
            const src = typeof b === 'string' ? b : (b.image || b.url || b.photo)
            const title = typeof b === 'string' ? '' : (b.title || '')
            return html`<div key=${i} className="banner-slide">
              <img src=${media(src)} alt=${title} loading=${i===0?'eager':'lazy'}/>
              ${title && html`<div className="banner-title">${title}</div>`}
            </div>`
          })}
        </div>
        ${n > 1 && html`<${React.Fragment}>
          <button className="banner-arrow prev" onClick=${()=>go(-1)} aria-label="Oldingi banner">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <button className="banner-arrow next" onClick=${()=>go(1)} aria-label="Keyingi banner">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <div className="banner-dots">
            ${banners.map((_,i) => html`<button key=${i} className=${'banner-dot'+(i===idx?' active':'')} onClick=${()=>setIdx(i)} aria-label=${'Banner '+(i+1)}></button>`)}
          </div>
        </${React.Fragment}>`}
      </div>
    </div>`
}

function App() {
  const [info,      setInfo]     = useState(null)
  const [products,  setProds]    = useState([])
  const [topIds,    setTopIds]   = useState([])   // eng ko'p sotilgan tovar ID'lari (tavsiya)
  const [cats,      setCats]     = useState([])
  const [showImages,setShowImg]  = useState(true)
  const [catImgs,   setCatImgs]  = useState({})
  const [loading,   setLoad]     = useState(true)
  const [error,     setErr]      = useState('')

  const [search,    setSearch]   = useState('')
  const [selTop,    setSelTop]   = useState(null)
  const [selSub,    setSelSub]   = useState(null)

  const [cart,      setCart]     = useState([])
  const [cartOpen,  setCartOpen] = useState(false)
  const [chkOpen,   setChkOpen]  = useState(false)
  const [subbing,   setSubbing]  = useState(false)
  const [done,      setDone]     = useState(null)

  const [customer,  setCust]     = useState(()=>{try{return JSON.parse(localStorage.getItem('sf_cust')||'null')}catch{return null}})
  const [loginOpen, setLoginOpen]= useState(false)
  const [portalOpen,setPortal]   = useState(false)
  const [srchOpen,  setSrchOpen] = useState(false)
  const [drawerOpen,  setDrawer]    = useState(false)
  const [navActive,   setNavActive] = useState('home')
  const [detailProd,  setDetail]    = useState(null)

  const searchRef  = useRef(null)
  const navCartRef = useRef(null)

  const [catStuck, setCatStuck] = useState(false)
  const catSentinelRef = useRef(null)

  const [activeCat, setActiveCat] = useState(null)
  const [scrollToCatId, setScrollToCatId] = useState(null)
  const sectionRefs = useRef({})

  const [subDropdown, setSubDropdown] = useState(null)
  const chipRefs = useRef({})
  const pageTitleRef = useRef(null)

  useEffect(() => {
    if (!subDropdown) return
    const close = () => setSubDropdown(null)
    const onKey = e => { if (e.key === 'Escape') close() }
    window.addEventListener('scroll', close, true)
    window.addEventListener('resize', close)
    window.addEventListener('keydown', onKey)
    return () => {
      window.removeEventListener('scroll', close, true)
      window.removeEventListener('resize', close)
      window.removeEventListener('keydown', onKey)
    }
  }, [subDropdown])

  const toggleSubDropdown = (catId, chipEl) => {
    setSubDropdown(sd => {
      if (sd && sd.catId === catId) return null
      const rect = chipEl.getBoundingClientRect()
      return { catId, top: rect.bottom + 8, left: rect.left }
    })
  }

  const pickSubFromDropdown = (topId, subId) => {
    setSelTop(topId); setSelSub(subId); setSubDropdown(null)
    pageTitleRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' })
  }

  useEffect(() => {
    const el = catSentinelRef.current
    if (!el) return
    const obs = new IntersectionObserver(
      ([entry]) => setCatStuck(!entry.isIntersecting),
      { rootMargin: '-64px 0px 0px 0px', threshold: 0 }
    )
    obs.observe(el)
    return () => obs.disconnect()
  }, [cats])

  useEffect(() => { api('/storefront/info/').then(setInfo).catch(()=>{}) }, [])

  // Eng ko'p sotilgan tovarlar (tavsiya bo'limi) — faqat ID'lar, yuklangan
  // mahsulotlar bilan solishtiriladi (topProducts)
  useEffect(() => {
    api('/storefront/top-products/?limit=12').then(r => setTopIds(r.product_ids || [])).catch(()=>{})
  }, [])

  // dukonline.uz "Online do'kon → Bannerlar" bo'limidan yuklangan rasmlar bo'lsa
  // o'shalar ko'rsatiladi, hali hech narsa yuklanmagan bo'lsa — namuna rasmlar.
  const banners = useMemo(() => {
    const fromApi = (info?.banners || [])
      .map(b => typeof b === 'string' ? b : (b.image_url || b.image || b.url || b.photo || b.file))
      .filter(Boolean).map(media)
    return fromApi.length ? fromApi : DEMO_BANNERS
  }, [info])

  useEffect(() => {
    setLoad(true)
    const q = customer ? '?customer_code='+encodeURIComponent(customer.customer_code) : ''
    api('/storefront/products/'+q).then(r => {
      const list = r.results || []
      setProds(list)
      setShowImg(r.show_images !== false)
      setCatImgs(Object.fromEntries((r.category_images||[]).map(c => [c.id, c.image])))
      // Kategoriya daraxti: leaf (o'z parent'i bilan) + parent kategoriyalar
      const map = new Map()
      list.forEach(p => {
        if (p.category_id && p.category_name) map.set(p.category_id, {id:p.category_id, name:p.category_name, parentId:p.category_parent_id||null})
        if (p.category_parent_id && p.category_parent_name && !map.has(p.category_parent_id))
          map.set(p.category_parent_id, {id:p.category_parent_id, name:p.category_parent_name, parentId:null})
      })
      setCats([...map.values()])
    }).catch(e=>setErr(e.message)).finally(()=>setLoad(false))
  }, [customer])

  useEffect(() => { if (srchOpen && searchRef.current) searchRef.current.focus() }, [srchOpen])

  const doLogin = c => { setCust(c); localStorage.setItem('sf_cust',JSON.stringify(c)); setLoginOpen(false) }
  const logout  = () => { setCust(null); localStorage.removeItem('sf_cust') }

  // Top ID'larni yuklangan mahsulot obyektlariga bog'laymiz (rank tartibi saqlanadi)
  const topProducts = useMemo(() => {
    if (!topIds.length || !products.length) return []
    const byId = new Map(products.map(p => [p.id, p]))
    return topIds.map(id => byId.get(id)).filter(Boolean).filter(p => !isOutOfStock(p))
  }, [topIds, products])

  const topCats = useMemo(()=>cats.filter(c=>!c.parentId), [cats])
  const subCats = useMemo(()=>selTop==null?[]:cats.filter(c=>c.parentId===selTop), [cats, selTop])
  // "Barchasi" olib tashlanganligi sababli, hech qaysi bo'lim scroll orqali
  // aniqlanmagan bo'lsa (masalan sahifa boshida) birinchi kategoriya yoritiladi
  const displayActiveCat = activeCat || (topCats[0] ? String(topCats[0].id) : null)

  const filtered = useMemo(() => {
    let l = products
    if (selSub)      l = l.filter(p => p.category_id === selSub)
    else if (selTop) l = l.filter(p => p.category_id === selTop || p.category_parent_id === selTop)
    if (search)      l = l.filter(p => p.name.toLowerCase().includes(search.toLowerCase()))
    return l
  }, [products, selTop, selSub, search])

  // Qidiruv aniq mos kelmasa — nom/kategoriya so'zlari ustma-ust tushgan mahsulotlarni taklif qilamiz
  const searchFallback = useMemo(() => {
    if (!search || filtered.length > 0) return []
    return searchSuggestions(search, products, 8)
  }, [search, filtered, products])

  // "Barchasi" ko'rinishida mahsulotlarni top-kategoriya bo'yicha bo'limlarga guruhlash
  // (scroll qilganda cat-bar'da tegishli kategoriya avtomatik yoritiladi)
  const groupedSections = useMemo(() => {
    if (selTop !== null || search || topCats.length === 0) return null
    const byCat = new Map(topCats.map(c => [c.id, []]))
    filtered.forEach(p => {
      const topId = p.category_parent_id || p.category_id
      if (byCat.has(topId)) byCat.get(topId).push(p)
    })
    return topCats.map(c => ({ cat: c, items: byCat.get(c.id) || [] })).filter(g => g.items.length > 0)
  }, [filtered, topCats, selTop, search])

  useEffect(() => {
    if (!groupedSections || groupedSections.length === 0) return
    const els = groupedSections.map(g => sectionRefs.current[g.cat.id]).filter(Boolean)
    if (!els.length) return
    const obs = new IntersectionObserver(entries => {
      entries.forEach(entry => { if (entry.isIntersecting) setActiveCat(entry.target.dataset.catId) })
    }, { rootMargin: '-160px 0px -70% 0px', threshold: 0 })
    els.forEach(el => obs.observe(el))
    return () => obs.disconnect()
  }, [groupedSections])

  useEffect(() => {
    if (!scrollToCatId) return
    const el = sectionRefs.current[scrollToCatId]
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' })
    setScrollToCatId(null)
  }, [scrollToCatId, groupedSections])

  const goToCat = (id) => {
    if (selTop !== null) { setSelTop(null); setSelSub(null) }
    setActiveCat(String(id))
    setScrollToCatId(id)
  }

  const total = cart.reduce((s,it)=>s+it.price*it.qty, 0)
  const count = cart.reduce((s,it)=>s+it.qty, 0)

  function _orbBounce(fromEl) {
    if (fromEl && navCartRef.current) {
      magicOrb(fromEl, navCartRef.current)
      setTimeout(() => {
        navCartRef.current?.classList.remove('nav-bounce')
        void navCartRef.current?.offsetWidth
        navCartRef.current?.classList.add('nav-bounce')
        setTimeout(() => navCartRef.current?.classList.remove('nav-bounce'), 550)
      }, 620)
    }
    if (navigator?.vibrate) navigator.vibrate(20)
  }

  function addToCart(p, unit, fromEl, qty=1) {
    const key  = p.id+'_'+(unit?.unit_id??'base')
    const mult = unit?.multiplier || 1
    // Og'irlik (kg) tovarda qoldiq kasr bo'lishi mumkin — floor qilmaymiz
    const weight = isWeightUnit(unit?.unit_name)
    const max  = p.stock_type==='tracked' ? (weight ? p.stock/mult : Math.floor(p.stock/mult)) : Infinity
    if (max <= 0) return
    setCart(c => {
      const ex = c.find(x=>x.key===key)
      if (ex) { if(ex.qty>=max) return c; return c.map(x=>x.key===key?{...x,qty:Math.min(x.qty+qty,max)}:x) }
      return [...c, {key,product_id:p.id,unit_id:unit?.unit_id,variant_id:null,variant_name:'',unit_name:unit?.unit_name||'dona',weight,name:p.name,price:unit?.price,currency:unit?.currency||'',cur_price:unit?.cur_price,qty:Math.min(qty,max),maxQty:max,image:p.image}]
    })
    _orbBounce(fromEl)
  }

  function addVariantToCart(p, variant, qty, fromEl) {
    const key = `${p.id}_v${variant.id}`
    const max = variant.stock != null ? Math.floor(variant.stock) : Infinity
    if (max <= 0) return
    setCart(c => {
      const ex = c.find(x=>x.key===key)
      if (ex) return c.map(x=>x.key===key?{...x,qty:Math.min(x.qty+qty,max)}:x)
      return [...c, {key,product_id:p.id,unit_id:null,variant_id:variant.id,variant_name:variant.name,unit_name:'dona',name:p.name,price:variant.price,currency:variant.currency||'',cur_price:variant.cur_price,qty,maxQty:max===Infinity?9999:max,image:p.image}]
    })
    _orbBounce(fromEl)
  }

  const updQty = (key,q) => setCart(c=>{ const it=c.find(x=>x.key===key); if(!it)return c; const cap=it.maxQty?Math.min(q,it.maxQty):q; return cap<=0?c.filter(x=>x.key!==key):c.map(x=>x.key===key?{...x,qty:cap}:x) })
  const remItem = key => setCart(c=>c.filter(x=>x.key!==key))

  async function submitOrder(form) {
    setSubbing(true)
    try {
      const body = {
        ...form,
        customer_code: customer?.customer_code,
        items: cart.map(it => ({
          product_id: it.product_id,
          ...(it.variant_id ? {variant_id: it.variant_id} : {}),
          ...(it.unit_id    ? {unit_id:    it.unit_id}    : {}),
          qty: it.qty,
        }))
      }
      const order = await api('/storefront/orders/',{method:'POST',body:JSON.stringify(body)})
      setCart([]); setChkOpen(false); setDone(order)
    } catch(e) { alert(e.message) } finally { setSubbing(false) }
  }

  const catName = (selSub||selTop) ? cats.find(c=>c.id===(selSub||selTop))?.name : null

  return html`<div>

    <!-- ── Header ──────────────────────────────────────────── -->

          ? html`<div className="header-search fade-in" style=${{maxWidth:'none',flex:1}}>

          : html`<${React.Fragment}>

                </button>

                  ? html`<button className="avatar-btn" onClick=${()=>setPortal(true)}>

                  : html`<button className="login-btn" onClick=${()=>setLoginOpen(true)}>
                      Kirish
                    </button>`}

            </${React.Fragment}>`}
      </div>

    <!-- ── Banner carousel ──────────────────────────────────── -->

              ${catImgs[c.id] && html`<img className="cat-chip-thumb" src=${media(catImgs[c.id])} alt=""/>`}
              ${c.name}
              ${cats.some(sc=>sc.parentId===c.id) && html`<span className=${'cat-chip-arrow'+(subDropdown&&subDropdown.catId===c.id?' open':'')}
                onClick=${e=>{e.stopPropagation();toggleSubDropdown(c.id, chipRefs.current[c.id])}}><${IChevronDown} s=${11}/></span>`}
            </button>`)}
        </div>
      </nav>`}

    <!-- ── Sub-category dropdown (chip strelkasi bosilganda) ── -->
    ${subDropdown && html`
      <${React.Fragment}>
        <div className="cat-subdrop-overlay" onClick=${()=>setSubDropdown(null)}></div>
        <div className="cat-subdrop" style=${{top:subDropdown.top+'px', left:subDropdown.left+'px'}}>
          ${cats.filter(sc=>sc.parentId===subDropdown.catId).map(sub => html`
            <button key=${sub.id} className="cat-subdrop-item" onClick=${()=>pickSubFromDropdown(subDropdown.catId, sub.id)}>
              ${catImgs[sub.id] && html`<img className="cat-subdrop-thumb" src=${media(catImgs[sub.id])} alt=""/>`}
              <span>${sub.name}</span>
            </button>`)}
        </div>
      </${React.Fragment}>`}

    <!-- ── Sub-category bar (tanlangan top'da sub bo'lsa) ───── -->
    ${subCats.length > 0 && html`
      <nav className="cat-bar cat-bar-sub">
        <div className="cat-bar-inner">
          <button className=${'cat-chip cat-chip-sub'+(selSub===null?' active':'')} onClick=${()=>setSelSub(null)}>
            Barchasi
          </button>
          ${subCats.map(c => html`
            <button key=${c.id} className=${'cat-chip cat-chip-sub'+(selSub===c.id?' active':'')} onClick=${()=>setSelSub(c.id)}>
              ${c.name}
            </button>`)}
        </div>
      </nav>`}

    <!-- ── Page body ───────────────────────────────────────── -->
    <main className="page-body">
      <h1 className="page-title" ref=${pageTitleRef}>
        ${catName || 'Katalog'}
        ${!loading && html`<span>${filtered.length} ta mahsulot</span>`}
      </h1>

      <!-- Top tovarlar (tavsiya) — faqat bosh sahifada (filtr/qidiruvsiz) -->
      ${!loading && !error && !search && selTop==null && selSub==null && topProducts.length>0 && html`
        <div className="top-rail-wrap">
          <div className="top-rail-head">
            <h2>Top tovarlar</h2>
            <span className="top-rail-badge">Eng ko'p sotilgan</span>
          </div>
          <div className="top-rail">
            ${topProducts.map(p => html`
              <div className="top-rail-item" key=${p.id}>
                <div className="top-rail-rank">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="#fff" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                  TOP
                </div>
                <${ProductItem} p=${p} onAdd=${addToCart} setQty=${updQty} cart=${cart} showImages=${showImages} onDetail=${setDetail}/>
              </div>`)}
          </div>
        </div>`}

      <!-- States -->
      ${loading && html`<${Skeleton}/>`}
      ${error   && html`<div className="product-grid"><div className="state-center">
        <div className="state-emoji">😕</div>
        <div className="state-text">Xatolik yuz berdi: ${error}</div>
      </div></div>`}
      ${!loading && !error && filtered.length===0 && searchFallback.length===0 && html`<div className="product-grid"><div className="state-center">
        <div className="state-emoji">🔍</div>
        <div className="state-text">Mahsulot topilmadi</div>
      </div></div>`}
      ${!loading && !error && filtered.length===0 && searchFallback.length>0 && html`
        <div>
          <div className="state-center" style=${{padding:'56px 20px 8px'}}>
            <div className="state-emoji">🔍</div>
            <div className="state-text">"${search}" bo'yicha aniq mos kelmadi</div>
          </div>
          <div className="fallback-label">Shunga o'xshash mahsulotlar</div>
          <div className="product-grid">
            ${searchFallback.map(p => html`
              <${ProductItem} key=${p.id} p=${p} onAdd=${addToCart} setQty=${updQty} cart=${cart} showImages=${showImages}
                onDetail=${setDetail}/>`)}
          </div>
        </div>`}

      <!-- Grid -->
      ${!loading && !error && filtered.length>0 && groupedSections && html`
        <div className="cat-sections">
          ${groupedSections.map(g => html`
            <section key=${g.cat.id} id=${'cat-sec-'+g.cat.id} data-cat-id=${g.cat.id} className="cat-section"
              ref=${el => { if (el) sectionRefs.current[g.cat.id] = el }}>
              <h2 className="cat-section-title">${g.cat.name}</h2>
              <div className="product-grid">
                ${g.items.map(p => html`
                  <${ProductItem} key=${p.id} p=${p} onAdd=${addToCart} setQty=${updQty} cart=${cart} showImages=${showImages}
                    onDetail=${setDetail}/>`)}
              </div>
            </section>`)}
        </div>`}
      ${!loading && !error && filtered.length>0 && !groupedSections && html`
        <div className="product-grid">
          ${filtered.map(p => html`
            <${ProductItem} key=${p.id} p=${p} onAdd=${addToCart} setQty=${updQty} cart=${cart} showImages=${showImages}
              onDetail=${setDetail}/>`)}
        </div>`}
    </main>

    <!-- ── Modals ──────────────────────────────────────────── -->
    <${CartSheet}
      open=${cartOpen} onClose=${()=>setCartOpen(false)}
      items=${cart} setQty=${updQty} remove=${remItem}
      total=${total} onCheckout=${()=>setChkOpen(true)}/>

    <${Checkout}
      open=${chkOpen} onClose=${()=>setChkOpen(false)}
      total=${total} totalStr=${groupTotal(cart)} onSubmit=${submitOrder} submitting=${subbing} customer=${customer}/>

    <${Login} open=${loginOpen} onClose=${()=>setLoginOpen(false)} onLogin=${doLogin}/>

    <${CustomerPortal}
      open=${portalOpen} onClose=${()=>setPortal(false)}
      customer=${customer} onLogout=${logout}/>

    ${done && html`<${Success} order=${done} onClose=${()=>setDone(null)}/>`}

    <!-- ── Product Detail ───────────────────── -->
    ${detailProd && html`<${ProductDetail}
      product=${detailProd}
      onClose=${()=>setDetail(null)}
      onAdd=${addToCart}
      onAddVariant=${addVariantToCart}
      cart=${cart}
      allProducts=${products}
      setCartQty=${updQty}
      showImages=${showImages}
      onSelect=${setDetail}/>`}

    <!-- ── Category Drawer ───────────────────── -->
    <${CategoryDrawer}
      open=${drawerOpen} onClose=${()=>setDrawer(false)}
      cats=${cats} selTop=${selTop} selSub=${selSub} catImgs=${catImgs}
      onSelect=${(top,sub)=>{setSelTop(top);setSelSub(sub);setNavActive('home')}}/>

    <!-- ── Bottom Nav ────────────────────────── -->
    <${BottomNav}
      active=${navActive}
      count=${count}
      cartIconRef=${navCartRef}
      onHome=${()=>{setSelTop(null);setSelSub(null);setActiveCat(null);setSearch('');setSrchOpen(false);setNavActive('home');window.scrollTo({top:0,behavior:'smooth'})}}
      onSearch=${()=>{setSrchOpen(s=>!s);setNavActive('search')}}
      onCart=${()=>{setCartOpen(true);setNavActive('cart');setTimeout(()=>setNavActive('home'),300)}}
      onDrawer=${()=>{setDrawer(d=>!d);setNavActive('catalog')}}/>
  </div>`
}

// Mobile search button — hide on desktop, show on mobile
const style = document.createElement('style')
style.textContent = '.mobile-search-trigger{display:none!important}@media(max-width:640px){.mobile-search-trigger{display:flex!important}.header-search{display:none!important}}'
document.head.appendChild(style)

createRoot(document.getElementById('root')).render(html`<${App}/>`)
</script>
</body>
</html>
